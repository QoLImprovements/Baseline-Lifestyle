name: Apply Fitness storage inventory decisions

on:
  push:
    branches:
      - agent/fix-skincare-routine-route-and-categories-20260804
    paths:
      - .github/workflows/apply-fitness-storage-inventory-decisions.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-skincare-routine-route-and-categories-20260804
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply reviewed storage decisions
        run: python3 .github/apply_fitness_storage_inventory_decisions.py

      - name: Install dependencies
        run: npm ci

      - name: Run complete website checks
        run: npm test

      - name: Commit verified implementation
        run: |
          rm .github/apply_fitness_storage_inventory_decisions.py
          rm .github/workflows/apply-fitness-storage-inventory-decisions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix skincare routine refresh and expand action categories"
          git push origin HEAD:agent/fix-skincare-routine-route-and-categories-20260804
