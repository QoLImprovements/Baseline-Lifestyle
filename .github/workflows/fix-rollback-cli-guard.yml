name: Fix rollback CLI guard

on:
  push:
    branches:
      - agent/complete-saved-data-runtime-20260802
    paths:
      - tools/fix_rollback_cli_guard.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-saved-data-runtime-20260802
          fetch-depth: 0
      - run: python3 tools/fix_rollback_cli_guard.py
      - run: git diff --check
      - name: Commit guard fix
        run: |
          if git diff --quiet -- sitewide/migration/build_sqlite_rollback_copy.php; then exit 0; fi
          git config user.name "Baseline Saved Data automation"
          git config user.email "actions@users.noreply.github.com"
          git add sitewide/migration/build_sqlite_rollback_copy.php
          git commit -m "Guard rollback CLI execution when included by tests"
          git push origin HEAD:agent/complete-saved-data-runtime-20260802
