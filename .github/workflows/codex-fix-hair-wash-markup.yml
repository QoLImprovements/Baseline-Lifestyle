name: Fix Hair Wash Markup

on:
  push:
    branches:
      - codex/add-soap-free-powdered-hair-wash

permissions:
  contents: write

jobs:
  fix-markup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/add-soap-free-powdered-hair-wash
          fetch-depth: 0

      - name: Fix recipe sibling structure and mixed-unit links
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('systems/baseline-natural-skincare/baseline-natural-skincare.html')
          html = path.read_text(encoding='utf-8')

          before_comment = '<li>This recipe is currently grouped under <strong>Testing</strong>.</li>\n</ul>\n<!-- Testing Recipe 11 -->'
          after_comment = '<li>This recipe is currently grouped under <strong>Testing</strong>.</li>\n</ul>\n</div>\n<!-- Testing Recipe 11 -->'
          assert html.count(before_comment) == 1, 'r10/r11 boundary not found exactly once'
          html = html.replace(before_comment, after_comment, 1)

          seven_closers = '<li>This recipe is currently grouped under <strong>Testing</strong>.</li>\n</ul>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</section>\n<!-- INGREDIENT LIBRARY -->'
          six_closers = '<li>This recipe is currently grouped under <strong>Testing</strong>.</li>\n</ul>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</section>\n<!-- INGREDIENT LIBRARY -->'
          assert html.count(seven_closers) == 1, 'recipe wrapper closing sequence not found'
          html = html.replace(seven_closers, six_closers, 1)

          replacements = {
            '<li><a class="ing-link" data-from-recipe="r11" data-ingredient="ing-water" href="#ing-water">Warm Water</a> – 20–30 g</li>': '<li><strong>Warm Water</strong> – 20–30 g</li>',
            '<li><a class="ing-link" data-from-recipe="r11" data-ingredient="ing-jojoba" href="#ing-jojoba">Jojoba Oil</a> – 80%</li>': '<li><strong>Jojoba Oil</strong> – 80%</li>',
            '<li><a class="ing-link" data-from-recipe="r11" data-ingredient="ing-argan" href="#ing-argan">Argan Oil</a> – 20%</li>': '<li><strong>Argan Oil</strong> – 20%</li>',
          }
          for old, new in replacements.items():
            assert html.count(old) == 1, f'mixed-unit link not found: {old}'
            html = html.replace(old, new, 1)

          r10_pos = html.index('data-recipe-slug="testing-microcurrent-conductive-gel"')
          r11_pos = html.index('data-recipe-slug="testing-soap-free-powdered-hair-wash"')
          between = html[r10_pos:r11_pos]
          assert between.rstrip().endswith('</div>\n<!-- Testing Recipe 11 -->') is False
          # Directly verify r10 is closed before the r11 comment/card.
          boundary = html[html.rfind('</ul>', r10_pos, r11_pos):r11_pos]
          assert '</div>\n<!-- Testing Recipe 11 -->\n<div class="recipe card recipe-page"' in boundary

          r11_start = html.index('<div class="recipe card recipe-page" data-category="Testing" data-recipe-slug="testing-soap-free-powdered-hair-wash" id="r11">')
          r11_end = html.index('</section>\n<!-- INGREDIENT LIBRARY -->', r11_start)
          r11 = html[r11_start:r11_end]
          assert 'data-from-recipe="r11"' not in r11
          assert '<h4>Method</h4>' in r11
          assert '<h4>Storage &amp; Use</h4>' in r11
          assert '<h4>Comedogenic Considerations</h4>' in r11
          assert '<h4>Notes</h4>' in r11

          path.write_text(html, encoding='utf-8')
          PY

          node --test tests/skincare-testing-recipes.test.mjs

          rm -f .github/workflows/codex-fix-hair-wash-markup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add systems/baseline-natural-skincare/baseline-natural-skincare.html .github/workflows/codex-fix-hair-wash-markup.yml
          git commit -m "Fix soap-free hair wash recipe structure"
          git push origin HEAD:codex/add-soap-free-powdered-hair-wash
