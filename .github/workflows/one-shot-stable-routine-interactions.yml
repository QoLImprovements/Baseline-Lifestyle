name: One-shot stable My Routine interactions

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply ownership cleanup
        run: python tools/one_shot_stable_routine_interactions.py

      - name: Parse changed JavaScript
        run: |
          node --check systems/baseline-fitness/js/fitness-routine-workspace.js
          node --check systems/baseline-fitness/js/fitness-routine-workspace-v2.js
          node --check systems/baseline-fitness/js/fitness-routine-log-v1.js
          node --check systems/baseline-natural-skincare/js/skincare-routine.js
          node --check systems/baseline-natural-skincare/js/skincare-routine-sitewide-v5.js

      - name: Commit to main
        run: |
          git config user.name "Baseline Routine Cleanup"
          git config user.email "actions@users.noreply.github.com"
          git add systems/baseline-fitness/baseline-fitness.html \
                  systems/baseline-fitness/js/fitness-routine-workspace.js \
                  systems/baseline-fitness/js/fitness-routine-workspace-v2.js \
                  systems/baseline-fitness/js/fitness-routine-log-v1.js \
                  systems/baseline-natural-skincare/js/skincare-routine.js \
                  systems/baseline-natural-skincare/js/skincare-routine-sitewide-v5.js
          git commit -m "Remove remaining My Routine render-state conflicts"
          git push origin HEAD:main
