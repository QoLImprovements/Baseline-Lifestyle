name: Patch Fitness legacy plan route

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-fitness-legacy-plan-route.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/routine-systems-overhaul-20260804
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Preserve legacy My Plan deep-link behaviour
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('systems/baseline-fitness/js/fitness-routine-workspace.js')
          text = path.read_text()
          old = "const remembered=global.sessionStorage?.getItem(VIEW_KEY); activateView(VIEWS.includes(remembered)?remembered:'log');"
          new = "const remembered=global.sessionStorage?.getItem(VIEW_KEY); const legacyPlanRoute=/\\/baseline-fitness\\/my-plan\\/?$/.test(global.location?.pathname||''); activateView(VIEWS.includes(remembered)?remembered:(legacyPlanRoute?'calisthenics':'log'));"
          if old not in text:
              if new in text:
                  raise SystemExit(0)
              raise SystemExit('legacy route insertion point not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Install locked dependencies
        run: npm ci

      - name: Run structure and unit checks
        run: |
          npm test
          npm run test:fitness
          npm run test:realm-stage2
          find sitewide systems -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          npm run test:saved-data-php

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser checks
        run: |
          npm run test:voice-ui
          npm run test:stability-smoke

      - name: Publish validated compatibility fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add systems/baseline-fitness/js/fitness-routine-workspace.js
          git commit -m "Preserve the legacy Fitness My Plan deep link"
          git push origin HEAD:agent/routine-systems-overhaul-20260804
