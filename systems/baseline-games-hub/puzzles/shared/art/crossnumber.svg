  <g font-family="ui-monospace,monospace" font-weight="900" text-anchor="middle" dominant-baseline="middle">
    <g fill="#1c2440" font-size="20"><text x="17" y="18">6</text><text x="89" y="18">4</text><text x="161" y="18">24</text><text x="89" y="90">18</text><text x="161" y="90">25</text><text x="161" y="162">20</text></g>
    <g fill="#eef2ff" font-size="21"><text x="53" y="18">×</text><text x="125" y="18">=</text><text x="89" y="54">−</text><text x="89" y="126">=</text><text x="125" y="90">+</text><text x="161" y="126">−</text></g>
