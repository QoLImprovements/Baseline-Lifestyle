name: Patch recipe Details and Adjustments

on:
  push:
    branches:
      - fix/recipe-details-empty-adjustments-plain-20260824

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[recipe-details-adjustments-patched]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: fix/recipe-details-empty-adjustments-plain-20260824
          fetch-depth: 0

      - name: Apply shared recipe patch
        run: python3 scripts/patch-recipe-details-adjustments.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitewide/js/baseline-shared.js sitewide/css/baseline-recipes.css
          if git diff --cached --quiet; then
            echo "No recipe template changes"
            exit 0
          fi
          git commit -m "Empty recipe Details and flatten Adjustments [recipe-details-adjustments-patched]"
          git push origin HEAD:fix/recipe-details-empty-adjustments-plain-20260824
