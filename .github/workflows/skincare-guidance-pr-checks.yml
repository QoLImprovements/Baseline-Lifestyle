name: Skincare guidance PR checks

on:
  push:
    branches:
      - skincare-guidance-storage-usage

permissions:
  contents: read

jobs:
  skincare-guidance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run Skincare guidance structural contract
        run: |
          node --test --test-name-pattern="every Skincare Guidance tab has separate expanded Usage and Storage sections" tests/skincare-testing-recipes.test.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Skincare guidance browser checks
        run: |
          npx playwright test tests/skincare-testing-recipes-browser.spec.js \
            --grep "Skincare recipe opens and survives refresh|every Skincare Guidance subtab exposes separate Usage and Storage sections" \
            --reporter=line
