name: Temporary expose content UI helper

on:
  push:
    branches:
      - fix/skincare-testing-embedded-20260823

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/skincare-testing-embedded-20260823
          fetch-depth: 0
      - run: python tools/_temp_expose_content_ui.py
      - name: Commit runtime correction only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitewide/js/baseline-shared.js
          git diff --cached --quiet && exit 0
          git commit -m "Expose content UI helper on eager recipe routes"
          git push origin HEAD:fix/skincare-testing-embedded-20260823
