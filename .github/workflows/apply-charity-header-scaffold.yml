name: Apply Charity header scaffold

on:
  push:
    branches:
      - agent/fix-charity-header-scaffold-20260803
    paths:
      - .github/scripts/apply_charity_header_scaffold.py
      - .github/workflows/apply-charity-header-scaffold.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Charity header patch
        run: python .github/scripts/apply_charity_header_scaffold.py
      - name: Commit generated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Charity banner structure"
          git push
