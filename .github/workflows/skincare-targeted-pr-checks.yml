name: Skincare targeted PR checks

on:
  push:
    branches:
      - skincare-new-recipes-and-cleanser-sliders

permissions:
  contents: read

jobs:
  skincare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run Skincare structural contracts
        run: |
          node --test tests/skincare-ingredient-conversion-coverage.test.mjs
          node --test --test-name-pattern="post-cutover browser storage never promotes retired account copies" tests/browser-storage-inventory.test.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run affected Skincare recipe browser regressions
        run: |
          npx playwright test \
            tests/skincare-recipe-runtime.spec.js \
            tests/skincare-testing-recipes-browser.spec.js \
            --grep "Oil Cleanser|Restorative Hydration Layer|Skin Soft Massage Oil|clarity-face-mask|sebum-compatible-cleansing-oil|skin-soft-massage-oil|catalogue|every embedded Skincare recipe preserves Details|all embedded Skincare recipe routes preserve exact selection" \
            --reporter=line
