name: Temporary r11 5 percent oil update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-set-r11-oil-5pct.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update r11 oil target
        shell: python
        run: |
          from pathlib import Path

          path = Path('systems/baseline-natural-skincare/baseline-natural-skincare.html')
          text = path.read_text(encoding='utf-8')

          replacements = {
              '<li><strong>Jojoba/Argan Oil Blend</strong> – 0.5–1 g</li>':
              '<li><strong>Jojoba/Argan Oil Blend</strong> – 5% of the final wet mixture (approximately 1.6–2.1 g with 20–30 g water)</li>',

              '<li><strong>Add oil</strong>: Add 0.5–1 g of the 80% jojoba / 20% argan oil blend.</li>':
              '<li><strong>Add oil</strong>: Add the 80% jojoba / 20% argan oil blend at 5% of the final wet mixture (approximately 1.6–2.1 g when using 20–30 g water).</li>',

              '<li>Each 10 g powder dose contains approximately 0.5 g sunflower lecithin. With 0.5–1 g added oil, this gives a lecithin-to-added-oil ratio of roughly 1:1 to 1:2 before accounting for natural scalp oil.</li>':
              '<li>Each 10 g powder dose contains approximately 0.5 g sunflower lecithin. At the 5% starting oil level, the added oil is approximately 1.6–2.1 g per wash depending on the water used, giving a lecithin-to-added-oil ratio of roughly 1:3.2 to 1:4.2 before accounting for natural scalp oil.</li>',

              '<li>The small oil dose is deliberate: increasing the added oil too far can reduce rinsability because this formula does not contain a conventional detergent surfactant.</li>':
              '<li>The 5% oil level is deliberate: this wash is intended to add a meaningful jojoba/argan conditioning oil phase while the lecithin helps disperse the oils and rinse away excess without conventional detergent surfactants.</li>',
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match for {old!r}; found {count}')
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
      - name: Run focused structural test
        run: node --test tests/skincare-testing-recipes.test.mjs
      - name: Commit recipe update and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-set-r11-oil-5pct.yml
          git add systems/baseline-natural-skincare/baseline-natural-skincare.html
          git commit -m "Set hair wash oil phase to 5 percent"
          git push origin main
