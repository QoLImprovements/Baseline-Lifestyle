name: Fix voice structure cache contract

on:
  push:
    branches:
      - agent/refine-fitness-voice-settings-20260803
    paths:
      - .github/scripts/fix_voice_structure_cache_test.py
      - .github/workflows/fix-voice-structure-cache-test.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/fix_voice_structure_cache_test.py
      - name: Commit corrected cache contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update voice runtime cache contract"
          git push
