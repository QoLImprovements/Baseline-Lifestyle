name: Live production smoke

on:
  push:
    branches:
      - verify/live-production-smoke-20260928

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify live Baseline Lifestyle routes
        shell: bash
        run: |
          set -euo pipefail
          base="https://baselinelifestyle.org"
          check() {
            path="$1"
            marker="$2"
            body="$(mktemp)"
            code="$(curl -sS -L --retry 2 --connect-timeout 10 --max-time 25 -A 'Baseline-Live-Smoke/1.0' -o "$body" -w '%{http_code}' "$base$path")"
            echo "$code $path"
            test "$code" -ge 200
            test "$code" -lt 400
            grep -Fq "$marker" "$body"
            rm -f "$body"
          }

          check "/" "Baseline Lifestyle"
          check "/baseline-natural-skincare/system" "Baseline Natural Skincare"
          check "/baseline-natural-skincare/recipes" "Recipes"
          check "/baseline-natural-skincare/ingredient-library/jojoba-oil?filter=r6" "Jojoba"
          check "/baseline-food-approach/recipes" "Baseline Food Approach"
          check "/baseline-food-approach/ingredient-library?filter=r5" "Ingredient Library"
          check "/baseline-fitness/my-routine/plan" "Baseline Fitness"
          check "/baseline-fitness/my-body/profile" "Baseline Fitness"
          check "/baseline-massage/system" "Baseline Massage"
          check "/baseline-badminton-session/system" "Baseline Badminton"
          check "/baseline-games-hub/games-hub" "Baseline Games Hub"
          check "/baseline-games-hub/games-hub/games-list" "Games Hub"

          echo "Live production smoke passed"
