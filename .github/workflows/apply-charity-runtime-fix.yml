name: Apply Charity runtime fix

on:
  push:
    branches:
      - agent/fix-charity-runtime-panels-20260803
    paths:
      - .github/scripts/apply_charity_runtime_fix.py
      - .github/workflows/apply-charity-runtime-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/apply_charity_runtime_fix.py
      - name: Commit corrected Charity runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Enable Charity banner panels and white bank total"
          git push
