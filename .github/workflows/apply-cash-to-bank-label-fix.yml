name: Apply Cash To Bank label fix

on:
  push:
    branches:
      - agent/fix-cash-to-bank-label-20260803
    paths:
      - .github/scripts/apply_cash_to_bank_label_fix.py
      - .github/workflows/apply-cash-to-bank-label-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/apply_cash_to_bank_label_fix.py
      - name: Commit corrected selector and cache key
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Cash To Bank label colour conclusively"
          git push
