name: Apply routine log, multiple plans and progression update

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.head_ref == 'agent/routine-log-multi-calisthenics-progression-20260806'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/routine-log-multi-calisthenics-progression-20260806
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Decode and apply migration
        run: |
          python3 - <<'PY'
          import base64, zlib
          from pathlib import Path
          payload = Path('scripts/apply_routine_log_multi_plans_progression_20260806.zb64').read_text().strip()
          Path('/tmp/apply_routine_log_multi_plans_progression_20260806.py').write_bytes(zlib.decompress(base64.b64decode(payload)))
          PY
          python3 /tmp/apply_routine_log_multi_plans_progression_20260806.py
          rm -f scripts/apply_routine_log_multi_plans_progression_20260806.zb64
          rmdir scripts 2>/dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Verify implementation
        run: |
          node --check sitewide/js/baseline-routine-system.js
          node --check systems/baseline-fitness/js/fitness-routine-workspace-v2.js
          node --check systems/baseline-fitness/js/fitness-multiple-plans.js
          node --check systems/baseline-fitness/js/fitness-saved-data-bridge.js
          node --check systems/baseline-fitness/js/baseline-fitness-app.js
          node --check systems/baseline-natural-skincare/js/skincare-routine.js
          node --check systems/baseline-natural-skincare/js/skincare-routine-sitewide-v4.js
          php -l systems/baseline-fitness/api/list_plans.php
          php -l systems/baseline-fitness/api/get_plan.php
          node --test tests/routine-log-multiple-plans-progression.test.mjs tests/fitness-independent-exercise-progression.test.mjs tests/fitness-routine-workspace.test.mjs tests/skincare-routine-groups-calendar.test.mjs
          npm run test:structure

      - name: Publish clean feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add historical routine logging, multiple calisthenics plans and custom progression"
          git push origin HEAD:agent/routine-log-multi-calisthenics-progression-20260806
