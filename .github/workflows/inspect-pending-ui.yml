name: Apply charity and shared UI fixes

on:
  push:
    paths:
      - .github/workflows/inspect-pending-ui.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply requested website changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Missing expected block: {label}')
              return text.replace(old, new, 1)

          # ------------------------------------------------------------------
          # Charity shop: Air Ambulance mirrored red/yellow colour system,
          # stronger containment, coherent subtabs and size tables without
          # unnecessary horizontal scrollbars.
          # ------------------------------------------------------------------
          css_path = 'systems/charity-shop/css/charity-shop.css'
          css = read(css_path)

          old_vars = '''  --charity-navy:#12344c;
  --charity-navy-2:#19536a;
  --charity-teal:#14979c;
  --charity-teal-light:#39b8b4;
  --charity-green:#20a36a;
  --charity-orange:#f5a11a;
  --charity-red:#d94f4f;
  --charity-cream:#f5f8f7;
  --charity-pale:#e6f1f2;
  --charity-line:rgba(18,52,76,.16);
  --charity-shadow:0 12px 30px rgba(18,52,76,.12);
  --charity-mirror:linear-gradient(90deg,
    var(--charity-navy) 0%,
    var(--charity-navy-2) 20%,
    var(--charity-teal) 42%,
    var(--charity-teal-light) 50%,
    var(--charity-teal) 58%,
    var(--charity-navy-2) 80%,
    var(--charity-navy) 100%);
  --charity-mirror-soft:linear-gradient(90deg,
    #e5eff0 0%,
    #f5f8f7 28%,
    #eefafa 50%,
    #f5f8f7 72%,
    #e5eff0 100%);'''

          new_vars = '''  --charity-navy:#17364d;
  --charity-navy-2:#354a57;
  --charity-teal:#c9252d;
  --charity-teal-light:#f5cf24;
  --charity-green:#2d8a57;
  --charity-orange:#f28c20;
  --charity-red:#941b22;
  --charity-cream:#fff9df;
  --charity-pale:#fff3c4;
  --charity-line:rgba(148,27,34,.24);
  --charity-shadow:0 14px 32px rgba(112,20,29,.17);
  --charity-mirror:linear-gradient(90deg,
    #941b22 0%,
    #c9252d 14%,
    #eb3f2f 27%,
    #f28c20 38%,
    #f5cf24 47%,
    #fff0a0 50%,
    #f5cf24 53%,
    #f28c20 62%,
    #eb3f2f 73%,
    #c9252d 86%,
    #941b22 100%);
  --charity-mirror-soft:linear-gradient(90deg,
    rgba(148,27,34,.22) 0%,
    rgba(201,37,45,.14) 16%,
    rgba(242,140,32,.13) 30%,
    rgba(245,207,36,.23) 42%,
    #fff9df 50%,
    rgba(245,207,36,.23) 58%,
    rgba(242,140,32,.13) 70%,
    rgba(201,37,45,.14) 84%,
    rgba(148,27,34,.22) 100%);
  --charity-panel-mirror:linear-gradient(90deg,
    rgba(201,37,45,.10) 0%,
    rgba(245,207,36,.17) 16%,
    #fff9df 34%,
    #ffffff 50%,
    #fff9df 66%,
    rgba(245,207,36,.17) 84%,
    rgba(201,37,45,.10) 100%);'''
          css = replace_once(css, old_vars, new_vars, 'charity colour variables')

          css = replace_once(
              css,
              '''.charity-hero{
  background:var(--charity-mirror);
  color:#fff;
  border-bottom:0;
}''',
              '''.charity-hero{
  background:var(--charity-mirror);
  color:#fff;
  border-bottom:4px solid rgba(148,27,34,.68);
  box-shadow:inset 7px 0 0 rgba(112,20,29,.72),inset -7px 0 0 rgba(112,20,29,.72),0 12px 30px rgba(112,20,29,.2);
}''',
              'charity hero containment'
          )

          css = replace_once(
              css,
              '''  border:1px solid rgba(255,255,255,.34) !important;
  border-radius:999px !important;
  background:rgba(255,255,255,.13) !important;
  background-image:none !important;
  color:#fff !important;
  -webkit-text-fill-color:#fff !important;''',
              '''  border:1px solid rgba(148,27,34,.48) !important;
  border-radius:999px !important;
  background:rgba(255,249,223,.94) !important;
  background-image:none !important;
  color:var(--charity-navy) !important;
  -webkit-text-fill-color:var(--charity-navy) !important;''',
              'charity main tab surface'
          )
          css = css.replace('background:rgba(255,255,255,.22) !important;\n  border-color:rgba(255,255,255,.58) !important;', 'background:#fff3c4 !important;\n  border-color:rgba(148,27,34,.72) !important;', 1)
          css = replace_once(
              css,
              '''  background:linear-gradient(90deg,#0d2e44 0%,#14979c 50%,#0d2e44 100%) !important;
  color:#fff !important;
  border-color:rgba(255,255,255,.7) !important;''',
              '''  background:linear-gradient(90deg,#941b22 0%,#c9252d 50%,#941b22 100%) !important;
  color:#fff !important;
  -webkit-text-fill-color:#fff !important;
  border-color:#fff0a0 !important;''',
              'charity selected main tab'
          )

          subtab_pattern = re.compile(r'/\* Subtabs sit inside each main section instead of stretching across the banner\. \*/.*?\.charity-subtab\[aria-selected="true"\]\{.*?\}\n', re.S)
          subtab_replacement = '''/* Charity subtabs use the same shared .subtabs/.subtab design as the rest of the site. */
.charity-subtabs{
  width:100%;
  max-width:100%;
  margin:0 0 18px;
}

.charity-subtab{
  min-height:40px;
}
'''
          css, count = subtab_pattern.subn(subtab_replacement, css, count=1)
          if count != 1:
              raise SystemExit('Could not replace charity subtab styling block')

          css = replace_once(
              css,
              '''  background:#ffffff;
  background-image:none;
  box-shadow:var(--charity-shadow);
  overflow:hidden;''',
              '''  background:var(--charity-panel-mirror);
  background-image:var(--charity-panel-mirror);
  box-shadow:inset 4px 0 0 rgba(201,37,45,.18),inset -4px 0 0 rgba(201,37,45,.18),var(--charity-shadow);
  overflow:hidden;''',
              'charity mirrored card panels'
          )
          css = css.replace('color:var(--charity-teal) !important;', 'color:#a51f27 !important;', 1)
          css = css.replace('background:#f2f9f8;', 'background:linear-gradient(90deg,#fff3c4 0%,#fff9df 50%,#fff3c4 100%);', 1)
          css = css.replace('border:1px solid rgba(20,151,156,.18);', 'border:1px solid rgba(201,37,45,.22);', 1)

          old_table = '''.charity-table-scroll{
  width:100%;
  overflow-x:auto;
  overscroll-behavior-inline:contain;
}

.charity-table-scroll table{
  width:100%;
  min-width:640px;
  border-collapse:collapse;
  background:#fff;
}

.charity-table-scroll th,
.charity-table-scroll td{
  padding:13px 15px;
  border-top:1px solid rgba(18,52,76,.12);
  text-align:left;
  vertical-align:middle;
  white-space:nowrap;
}'''
          new_table = '''.charity-table-scroll{
  width:100%;
  overflow:visible;
}

.charity-table-scroll table{
  width:100%;
  table-layout:fixed;
  border-collapse:collapse;
  background:#fff9df;
}

.charity-table-scroll th,
.charity-table-scroll td{
  padding:10px 9px;
  border-top:1px solid rgba(148,27,34,.15);
  text-align:left;
  vertical-align:middle;
  white-space:normal;
  overflow-wrap:anywhere;
  line-height:1.3;
  font-size:clamp(12px,1.15vw,15px);
}'''
          css = replace_once(css, old_table, new_table, 'charity size table fit')
          css = css.replace('background:var(--charity-navy);\n  color:#fff;', 'background:linear-gradient(90deg,#941b22 0%,#c9252d 50%,#941b22 100%);\n  color:#fff;', 1)
          css = css.replace('background:#f3f8f8;', 'background:#fff3c4;', 1)
          css = css.replace('background:#e8f5f5;', 'background:#ffeaa0;', 1)

          # Charity menu and Binaural surfaces remain opaque but use the warm page palette.
          css = css.replace('background:#ffffff !important;\n  background-image:none !important;\n  background-color:#ffffff !important;', 'background:#fff9df !important;\n  background-image:none !important;\n  background-color:#fff9df !important;', 1)
          write(css_path, css)

          # ------------------------------------------------------------------
          # Charity protected page banner: current section dropdown, ordinary
          # pages only, no redundant lock button, shared subtab classes, Systems.
          # ------------------------------------------------------------------
          charity_path = 'systems/charity-shop/charity-shop.php'
          charity = read(charity_path)
          old_banner = '''  <div class="bl-homebar" role="navigation" aria-label="Charity shop guidance navigation">
    <div class="bl-homebar-inner">
      <div class="charity-homebar-actions">
        <span class="charity-access-label" aria-label="Protected website section">Protected section</span>
        <button class="bl-mini-btn" id="charityLockBtn" type="button">Lock &amp; return home</button>
      </div>
    </div>
  </div>'''
          new_banner = '''  <div class="bl-homebar" role="navigation" aria-label="Charity shop guidance navigation">
    <div class="bl-homebar-inner">
      <div class="bl-pages-dd">
        <button class="bl-mini-btn bl-pages-btn" id="bl-pages-toggle" type="button" aria-haspopup="menu" aria-expanded="false">Charity Shop &#9662;</button>
        <div class="bl-pages-menu" role="menu" hidden>
          <a class="bl-pages-link" role="menuitem" href="/home/1">Home</a>
          <a class="bl-pages-link" role="menuitem" href="/baseline-food-approach/system">Baseline Food Approach</a>
          <a class="bl-pages-link" role="menuitem" href="/baseline-massage/system">Baseline Massage</a>
          <a class="bl-pages-link" role="menuitem" href="/baseline-natural-skincare/system">Baseline Natural Skincare</a>
          <a class="bl-pages-link" role="menuitem" href="/baseline-fitness/system">Baseline Fitness</a>
          <a class="bl-pages-link" role="menuitem" href="/baseline-badminton-session/system">Baseline Badminton Session</a>
          <a class="bl-pages-link" role="menuitem" href="/baseline-games-hub/games-hub">Baseline Games Hub</a>
        </div>
      </div>
    </div>
  </div>'''
          charity = replace_once(charity, old_banner, new_banner, 'charity protected banner')
          charity = charity.replace('class="charity-subtabs"', 'class="subtabs charity-subtabs"')
          charity = charity.replace('class="charity-subtab"', 'class="subtab charity-subtab"')
          charity = charity.replace('data-charity-subtarget="overview">Overview</button>', 'data-charity-subtarget="overview">Systems</button>', 1)
          charity = re.sub(r'/systems/charity-shop/css/charity-shop\.css\?v=[^"\']+', '/systems/charity-shop/css/charity-shop.css?v=CHARITY_GUIDANCE_20260728_3', charity)
          charity = re.sub(r'/systems/charity-shop/js/charity-shop\.js\?v=[^"\']+', '/systems/charity-shop/js/charity-shop.js?v=CHARITY_GUIDANCE_20260728_3', charity)
          write(charity_path, charity)

          # ------------------------------------------------------------------
          # Protected key: place immediately after the section dropdown on every
          # page, with fallback beside the banner controls or inside the home header.
          # ------------------------------------------------------------------
          access_path = 'sitewide/js/baseline-charity-access.js'
          access = read(access_path)
          access = access.replace("const BUILD = 'BASELINE_PROTECTED_ACCESS_20260728_2';", "const BUILD = 'BASELINE_PROTECTED_ACCESS_20260728_3';", 1)
          old_host = '''    const header = document.querySelector('.bl-top-header');
    if(!header || document.getElementById('blProtectedKey')) return null;'''
          new_host = '''    const pagesDropdown = document.querySelector('.bl-homebar-inner .bl-pages-dd');
    const homebarInner = document.querySelector('.bl-homebar-inner');
    const topHeader = document.querySelector('.bl-top-header');
    const host = homebarInner || topHeader;
    if(!host || document.getElementById('blProtectedKey')) return null;'''
          access = replace_once(access, old_host, new_host, 'protected key host')
          access = replace_once(
              access,
              '    header.insertBefore(button, header.firstChild);',
              '''    if(pagesDropdown && pagesDropdown.parentNode === host){
      pagesDropdown.insertAdjacentElement('afterend', button);
    }else{
      const rightControls = host.querySelector('.bl-homebar-right');
      if(rightControls) host.insertBefore(button, rightControls);
      else host.insertBefore(button, host.firstChild);
    }''',
              'protected key position'
          )
          write(access_path, access)

          # ------------------------------------------------------------------
          # Load the protected-key interface from the shared script on every page.
          # ------------------------------------------------------------------
          shared_path = 'sitewide/js/baseline-shared.js'
          shared = read(shared_path)
          loader_anchor = '''
 function setupAuthFlyout(){
'''
          loader_code = '''
  function setupProtectedAccessLoader(){
    try{
      if(window.__BASELINE_PROTECTED_ACCESS__) return;
      if(document.querySelector('script[src*="/sitewide/js/baseline-charity-access.js"]')) return;
      const script = document.createElement('script');
      script.src = '/sitewide/js/baseline-charity-access.js?v=BASELINE_PROTECTED_ACCESS_20260728_3';
      script.defer = true;
      script.dataset.protectedAccessLoader = 'true';
      document.head.appendChild(script);
    }catch(_e){}
  }

 function setupAuthFlyout(){
'''
          shared = replace_once(shared, loader_anchor, loader_code, 'shared protected loader definition')
          shared = replace_once(
              shared,
              "    safeInit('homebar right controls', setupHomebarRightControls);",
              "    safeInit('homebar right controls', setupHomebarRightControls);\n    safeInit('protected access loader', setupProtectedAccessLoader);",
              'shared protected loader boot'
          )
          write(shared_path, shared)

          # ------------------------------------------------------------------
          # Baseline Massage: keep Show All pinned above alphabetical options.
          # ------------------------------------------------------------------
          massage_path = 'systems/baseline-massage/baseline-massage.html'
          massage = read(massage_path)
          comparator = '''    options.sort((a, b) => {
      if(allNumeric){'''
          comparator_new = '''    options.sort((a, b) => {
      const aShowAll = String(a.value || '').toLowerCase() === 'all' || /^show all$/i.test(String(a.textContent || '').trim());
      const bShowAll = String(b.value || '').toLowerCase() === 'all' || /^show all$/i.test(String(b.textContent || '').trim());
      if(aShowAll !== bShowAll) return aShowAll ? -1 : 1;
      if(allNumeric){'''
          massage = replace_once(massage, comparator, comparator_new, 'massage Show All ordering')
          write(massage_path, massage)

          # ------------------------------------------------------------------
          # Binaural panel: wider and more compact so the full panel fits without
          # an internal scrollbar.
          # ------------------------------------------------------------------
          sitewide_css_path = 'sitewide/css/baseline-sitewide.css'
          sitewide_css = read(sitewide_css_path)
          sitewide_css = sitewide_css.replace('  --bl-binaural-panel-width: min(440px, calc(100vw - 24px));', '  --bl-binaural-panel-width: min(560px, calc(100vw - 24px));', 1)
          sitewide_css = replace_once(
              sitewide_css,
              '''  max-height: calc(100vh - 90px) !important;
  padding: 18px 18px 20px !important;
  overflow-x: hidden !important;
  overflow-y: auto !important;''',
              '''  max-height: none !important;
  padding: 14px 16px 16px !important;
  overflow-x: hidden !important;
  overflow-y: visible !important;''',
              'binaural no-scroll card geometry'
          )
          compact_anchor = '''html body[data-app] #bl-beats-flyout.bl-flyout .card.bl-player > p:first-of-type{
  margin: 0 0 14px 0 !important;
  font-size: inherit !important;
  line-height: 1.45 !important;
}
'''
          compact_new = '''html body[data-app] #bl-beats-flyout.bl-flyout .card.bl-player > p:first-of-type{
  margin: 0 0 8px 0 !important;
  font-size: 14px !important;
  line-height: 1.35 !important;
}

html body[data-app] #bl-beats-flyout.bl-flyout .card.bl-player > label{
  display:block !important;
  margin:8px 0 3px !important;
  line-height:1.2 !important;
}

html body[data-app] #bl-beats-flyout.bl-flyout .card.bl-player > .row{
  margin-top:4px !important;
}

html body[data-app] #bl-beats-flyout.bl-flyout #bl-user-presets{
  margin-top:8px !important;
}

html body[data-app] #bl-beats-flyout.bl-flyout #bl-beats-status{
  min-height:0 !important;
  margin-top:6px !important;
}
'''
          sitewide_css = replace_once(sitewide_css, compact_anchor, compact_new, 'binaural compact spacing')
          sitewide_css = sitewide_css.replace('''/* Keep flyout content usable on small screens */
.bl-flyout .bl-player{
  max-height: calc(100vh - 90px);
  overflow-y: auto;
}''', '''/* Binaural content is compact enough to fit without an internal scrollbar. */
.bl-flyout .bl-player{
  max-height:none;
  overflow-y:visible;
}''', 1)
          write(sitewide_css_path, sitewide_css)

          home_css_path = 'sitewide/css/baseline-home.css'
          home_css = read(home_css_path)
          home_css = replace_once(
              home_css,
              '''body[data-app="home"] #bl-auth-flyout,
body[data-app="home"] #bl-beats-flyout{
  width:min(440px, calc(100vw - 24px)) !important;
  max-width:min(440px, calc(100vw - 24px)) !important;
  min-width:0 !important;
  z-index:13000 !important;
}''',
              '''body[data-app="home"] #bl-auth-flyout{
  width:min(440px, calc(100vw - 24px)) !important;
  max-width:min(440px, calc(100vw - 24px)) !important;
  min-width:0 !important;
  z-index:13000 !important;
}

body[data-app="home"] #bl-beats-flyout{
  width:min(560px, calc(100vw - 24px)) !important;
  max-width:min(560px, calc(100vw - 24px)) !important;
  min-width:0 !important;
  z-index:13000 !important;
}''',
              'home binaural width'
          )
          home_css = replace_once(
              home_css,
              '''  body[data-app="home"] #bl-auth-flyout,
  body[data-app="home"] #bl-beats-flyout{
    /* Do not pin the flyout to the bottom of the tall index header.
       baseline-shared.js positions it from the actual Account/Binaural button,
       matching the spacing used on the other HTML pages. */
    max-height:calc(100svh - 90px) !important;
    overflow-y:auto !important;
  }''',
              '''  body[data-app="home"] #bl-auth-flyout{
    max-height:calc(100svh - 90px) !important;
    overflow-y:auto !important;
  }

  body[data-app="home"] #bl-beats-flyout{
    max-height:none !important;
    overflow-y:visible !important;
  }''',
              'home binaural no-scroll rule'
          )
          write(home_css_path, home_css)

          # ------------------------------------------------------------------
          # Cache-bust the shared assets across HTML/PHP pages so every section
          # receives the key and Binaural fixes on the next load.
          # ------------------------------------------------------------------
          excluded_parts = {'.git', 'node_modules', 'vendor'}
          for path in Path('.').rglob('*'):
              if not path.is_file() or path.suffix.lower() not in {'.html', '.php'}:
                  continue
              if any(part in excluded_parts for part in path.parts):
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              updated = re.sub(r'(/sitewide/js/baseline-shared\.js)\?v=[^"\'<>\s]+', r'\1?v=SITEWIDE_UI_20260728_3', text)
              updated = re.sub(r'(/sitewide/css/baseline-sitewide\.css)\?v=[^"\'<>\s]+', r'\1?v=SITEWIDE_UI_20260728_3', updated)
              updated = re.sub(r'(/sitewide/js/baseline-charity-access\.js)\?v=[^"\'<>\s]+', r'\1?v=BASELINE_PROTECTED_ACCESS_20260728_3', updated)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          # Remove temporary inspection material and this one-use installer.
          for obsolete in [
              Path('diagnostics/pending-ui-inspection.txt'),
              Path('.github/workflows/inspect-pending-ui.yml'),
          ]:
              if obsolete.exists():
                  obsolete.unlink()
          diagnostics = Path('diagnostics')
          if diagnostics.exists() and not any(diagnostics.iterdir()):
              diagnostics.rmdir()
          PY

      - name: Run structural tests
        run: npm test

      - name: Commit requested changes
        run: |
          git config user.name "Baseline Lifestyle Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "Apply charity theme and shared UI fixes"
          git push origin HEAD:main
