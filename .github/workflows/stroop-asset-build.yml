name: Build staged Stroop asset

on:
  push:
    branches:
      - concepts-stroop-template
    paths:
      - ".asset-staging/stroop/**"
      - ".github/workflows/stroop-asset-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: concepts-stroop-template
      - name: Reconstruct selected Stroop artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p systems/baseline-recreation/concepts/stroop-effect/art
          cat .asset-staging/stroop/part*.b64 | base64 -d > systems/baseline-recreation/concepts/stroop-effect/art/stroop-effect.webp
          echo "514e38fe97b324a1d954fdcdda3e9e90197294627409c055bc1aa80113cf9679  systems/baseline-recreation/concepts/stroop-effect/art/stroop-effect.webp" | sha256sum -c -
      - name: Commit reconstructed artwork
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add systems/baseline-recreation/concepts/stroop-effect/art/stroop-effect.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add selected Stroop Effect artwork"
          git push origin HEAD:concepts-stroop-template
