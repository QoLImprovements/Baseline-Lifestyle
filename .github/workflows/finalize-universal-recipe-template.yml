name: Finalize universal recipe template

on:
  push:
    branches:
      - feat/universal-recipe-template-20260824

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[universal-recipe-finalized]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: feat/universal-recipe-template-20260824
          fetch-depth: 0

      - name: Finalize universal recipe template
        run: python3 scripts/finalize-universal-recipe-template.py

      - name: Commit final runtime changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitewide/js/baseline-shared.js
          if git diff --cached --quiet; then
            echo "No final runtime changes"
            exit 0
          fi
          git commit -m "Finalize universal recipe runtime [universal-recipe-finalized]"
          git push origin HEAD:feat/universal-recipe-template-20260824
