name: Recreation mobile and puzzle history regressions

on:
  pull_request:
    paths:
      - '.github/workflows/recreation-mobile-route-regression.yml'
      - 'systems/baseline-recreation/**'
      - 'tests/baseline-recreation-core-controls.spec.js'
      - 'tests/navigation-state-browser.spec.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-route:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check mobile touch targets and jigsaw Back Forward
        run: npx playwright test tests/baseline-recreation-core-controls.spec.js tests/navigation-state-browser.spec.js --grep 'Recreation fits|Puzzles exact non-default jigsaw survives Back and Forward' --workers=1 --reporter=line
