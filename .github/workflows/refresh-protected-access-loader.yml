name: Refresh protected access loader

on:
  push:
    paths:
      - .github/workflows/refresh-protected-access-loader.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh loader version and remove installer
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '/sitewide/js/baseline-charity-access.js?v=BASELINE_CHARITY_ACCESS_20260728_1'
          new = '/sitewide/js/baseline-charity-access.js?v=BASELINE_PROTECTED_ACCESS_20260728_2'
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          elif new not in text:
              raise SystemExit('Protected-access loader was not found in index.html.')

          installer = Path('.github/workflows/refresh-protected-access-loader.yml')
          if installer.exists():
              installer.unlink()
          PY

      - name: Commit refreshed loader
        run: |
          git config user.name "Baseline Lifestyle Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/refresh-protected-access-loader.yml
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "Refresh generic protected access loader"
          git push origin HEAD:main
