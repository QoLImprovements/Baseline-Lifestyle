name: One-shot My Routine first-paint consolidation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-my-routine-first-paint.yml

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Consolidate first-paint ownership
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new, label):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              path.write_text(text.replace(old, new, 1))

          def sub_once(path, pattern, replacement, label, flags=0):
              text = path.read_text()
              new, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one regex match, found {count}')
              path.write_text(new)

          # ------------------------------------------------------------------
          # Fitness HTML: route identity must exist in <head>, before first paint.
          # ------------------------------------------------------------------
          fitness_html = Path('systems/baseline-fitness/baseline-fitness.html')
          old_fitness_boot = '<script>!function(){var t=location.pathname.match(/\\/(system|my-routine|my-plan|my-body|library|exercise-library|workout-routine|achievements)\\/?$/),e=t?t[1]:"system";document.documentElement.setAttribute("data-initial-fitness-tab",{"exercise-library":"library","workout-routine":"my-plan","my-routine":"my-plan"}[e]||e)}()</script>'
          new_fitness_boot = '''<script id="baseline-fitness-first-paint">!function(){var d=document.documentElement,p=location.pathname.replace(/\\/+$/,''),v='',plan='',m;try{m=p.match(/^\\/baseline-fitness\\/my-routine\\/(log|summary|public)$/i);if(m)v=m[1].toLowerCase();else if((m=p.match(/^\\/baseline-fitness\\/my-routine\\/plan(?:\\/(calisthenics|cardio|other|sports))?$/i))){v='plan';plan=(m[1]||'calisthenics').toLowerCase()}else if(/^\\/baseline-fitness\\/my-routine$/i.test(p)){var sv=String(sessionStorage.getItem('__bl_fitness_routine_view_v2__')||''),sp=String(sessionStorage.getItem('__bl_fitness_plan_view_v4__')||'');if(['log','summary','plan','public'].includes(sv)){v=sv;plan=['calisthenics','cardio','other','sports'].includes(sp)?sp:'calisthenics'}else if(['calisthenics','cardio','other','sports'].includes(sv)){v='plan';plan=sv}else v='log'}if(v){d.setAttribute('data-initial-fitness-tab','my-plan');d.setAttribute('data-initial-routine-view',v);if(plan)d.setAttribute('data-initial-routine-plan',plan);sessionStorage.setItem('__bl_fitness_routine_view_v2__',v==='plan'?(plan||'calisthenics'):(v==='public'?'summary':v));sessionStorage.setItem('__bl_fitness_plan_view_v4__',plan||'calisthenics');return}}catch(_e){}var t=p.match(/\\/(system|my-plan|my-body|library|exercise-library|workout-routine|achievements)$/),e=t?t[1]:'system';d.setAttribute('data-initial-fitness-tab',{'exercise-library':'library','workout-routine':'my-plan'}[e]||e)}()</script><style id="baseline-fitness-first-paint-style">html[data-initial-fitness-tab="my-plan"] #system{display:none!important}html[data-initial-fitness-tab="my-plan"] #my-plan{display:block!important}html[data-initial-fitness-tab="my-body"] #system{display:none!important}html[data-initial-fitness-tab="my-body"] #my-body{display:block!important}html[data-initial-fitness-tab="library"] #system{display:none!important}html[data-initial-fitness-tab="library"] #library{display:block!important}html[data-initial-fitness-tab="achievements"] #system{display:none!important}html[data-initial-fitness-tab="achievements"] #achievements{display:block!important}html[data-initial-fitness-tab="my-plan"][data-initial-routine-view] #my-plan:not([data-routine-workspace-v2="true"])>.grid{display:none!important}</style>'''
          replace_once(fitness_html, old_fitness_boot, new_fitness_boot, 'Fitness head route bootstrap')

          old_loader_tag = '<script defer="defer" src="/systems/baseline-fitness/js/fitness-routine-workspace.js?v=BASELINE_FITNESS_ROUTINE_WORKSPACE_20260807_3"></script>'
          static_chain = '''<script defer="defer" src="/systems/baseline-fitness/js/fitness-activity-catalogue-v2.js?v=BASELINE_FITNESS_ACTIVITY_CATALOGUE_20260805_3" data-fitness-activity-catalogue-v2="true" data-loaded="true"></script><script defer="defer" src="/systems/baseline-fitness/js/fitness-exercise-family-filter.js?v=BASELINE_FITNESS_EXERCISE_FAMILY_FILTER_20260808_2" data-fitness-exercise-family-filter="true" data-loaded="true"></script><script defer="defer" src="/sitewide/js/baseline-routine-system.js?v=SITEWIDE_MY_ROUTINE_SYSTEM_20260808_6" data-baseline-routine-system="true" data-loaded="true"></script><script defer="defer" src="/systems/baseline-fitness/js/fitness-routine-summary-v2.js?v=BASELINE_FITNESS_ROUTINE_SUMMARY_20260810_2" data-fitness-routine-summary-v3="true" data-loaded="true"></script><script defer="defer" src="/systems/baseline-fitness/js/fitness-routine-structure-v4.js?v=BASELINE_FITNESS_ROUTINE_STRUCTURE_20260811_1" data-fitness-routine-structure-v6="true" data-loaded="true"></script><script defer="defer" src="/systems/baseline-fitness/js/fitness-routine-workspace-v2.js?v=BASELINE_FITNESS_ROUTINE_WORKSPACE_20260811_1" data-fitness-routine-workspace-v2="true" data-loaded="true"></script><script defer="defer" src="/systems/baseline-fitness/js/fitness-routine-log-v1.js?v=BASELINE_FITNESS_ROUTINE_LOG_20260809_1" data-fitness-routine-log-v1="true" data-loaded="true"></script><script defer="defer" src="/systems/baseline-fitness/js/fitness-routine-groups-v2.js?v=BASELINE_FITNESS_ROUTINE_GROUPS_20260808_3" data-fitness-routine-groups-v2="true" data-loaded="true"></script><script defer="defer" src="/systems/baseline-fitness/js/fitness-generator-progression-v1.js?v=BASELINE_FITNESS_GENERATOR_PROGRESSION_20260809_6" data-fitness-generator-progression-v5="true" data-loaded="true"></script><script defer="defer" src="/systems/baseline-fitness/js/fitness-live-policy-v1.js?v=BASELINE_FITNESS_LIVE_POLICY_20260809_5" data-fitness-live-policy-v3="true" data-loaded="true"></script><script defer="defer" src="/sitewide/js/baseline-public-routine-viewonly-v4.js?v=BASELINE_PUBLIC_ROUTINE_VIEWONLY_20260809_2" data-baseline-public-routine-viewonly-v4="true" data-loaded="true"></script><script defer="defer" src="/sitewide/js/baseline-routine-coherence-v12.js?v=BASELINE_ROUTINE_COHERENCE_20260810_2" data-baseline-routine-coherence-v12="true" data-loaded="true"></script>''' + old_loader_tag
          replace_once(fitness_html, old_loader_tag, static_chain, 'Fitness static My Routine owner chain')

          # Fitness structure is loaded before the base workspace. It exposes one
          # synchronous boot entry that the base workspace calls in the same task.
          structure = Path('systems/baseline-fitness/js/fitness-routine-structure-v4.js')
          old_structure_tail = "  if (document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot,{ once:true });\n  else boot();\n})(typeof window!=='undefined'?window:globalThis);\n"
          new_structure_tail = "  global.BASELINE_fitnessRoutineStructure=Object.freeze({ boot,rebuildStructure,activateTopView,activatePlanView });\n  if (document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot,{ once:true });\n  else boot();\n})(typeof window!=='undefined'?window:globalThis);\n"
          replace_once(structure, old_structure_tail, new_structure_tail, 'Fitness structure boot export')

          # Fitness base: no empty render, no 8-second auth polling, local state
          # paints once; remote state repaints only if it is actually different.
          workspace = Path('systems/baseline-fitness/js/fitness-routine-workspace-v2.js')
          load_auth_pattern = r"  async function loadForAuth\(snapshot\) \{.*?\n  \}\n\n  function attachAuth\(\) \{.*?\n  \}\n\n  function boot\(\) \{.*?\n  \}\n\n  if \(document\.readyState === 'loading'\)"
          load_auth_replacement = '''  function renderStableState() {
    renderAll();
    try { global.BASELINE_fitnessRoutineSummary?.render?.(); } catch (_error) {}
    try { document.dispatchEvent(new CustomEvent('baseline:fitness-routine-updated',{ detail:{ source:'fitness-routine-state' } })); } catch (_error) {}
  }

  async function loadForAuth(snapshot) {
    const authed = Boolean(snapshot?.authed);
    const owner = authed ? String(snapshot.name || snapshot.user?.name || '').trim() : 'guest';
    const nextOwner = owner || 'guest';
    const changed = normaliseOwner(nextOwner) !== normaliseOwner(state.owner);
    state.authed = authed;
    state.owner = nextOwner;
    if (!changed && state.loaded) return;

    const local = readLocal(state.owner);
    state.activities = local?.activities || [];
    state.logs = normaliseLogs(local?.logs || {});
    state.loaded = true;
    renderStableState();
    if (!authed) return;

    const before = JSON.stringify({ activities:state.activities,logs:state.logs });
    const response = await request();
    if (response.ok && response.hasRoutine) {
      state.activities = normaliseActivities(response.activities);
      state.logs = normaliseLogs(response.logs);
      writeLocal();
    } else if (state.activities.length || Object.keys(state.logs).length) {
      saveNow();
    }
    const after = JSON.stringify({ activities:state.activities,logs:state.logs });
    if (after !== before) renderStableState();
  }

  function attachAuth() {
    const auth = global.BASELINE_auth;
    if (auth && typeof auth.get === 'function') {
      loadForAuth(auth.get());
      if (typeof auth.onChange === 'function') auth.onChange(loadForAuth);
      return;
    }
    loadForAuth(null);
  }

  function boot() {
    makeWorkspace();
    bindEvents();
    document.addEventListener('baseline:fitness-plans-updated', () => { renderLog(); renderCalendar(); });
    try {
      global.BASELINE_fitnessRoutine = Object.freeze({
        getState:() => ({
          activities:normaliseActivities(state.activities),
          logs:normaliseLogs(state.logs),
          selectedDate:state.selectedDate,
          activeView:state.activeView,
          calendarView:state.calendarView
        }),
        selectView:(view) => activateView(view, true),
        render:renderAll
      });
    } catch (_error) {}
    global.BASELINE_fitnessRoutineStructure?.boot?.();
    attachAuth();
  }

  if (document.readyState === 'loading')'''
          sub_once(workspace, load_auth_pattern, load_auth_replacement, 'Fitness stable state boot', re.S)

          # ------------------------------------------------------------------
          # Skincare HTML: route + exact subpanel are known in <head>.
          # ------------------------------------------------------------------
          skin_html = Path('systems/baseline-natural-skincare/baseline-natural-skincare.html')
          skin_text = skin_html.read_text()
          skin_boot = '''<script id="baseline-skincare-first-paint">!function(){var d=document.documentElement,p=location.pathname.replace(/\\/+$/,''),v='',m;try{m=p.match(/^\\/baseline-natural-skincare\\/my-routine\\/(log|summary|plan|public)$/i);if(m)v=m[1].toLowerCase();else if(/^\\/baseline-natural-skincare\\/my-routine$/i.test(p)){var s=String(sessionStorage.getItem('__bl_skincare_routine_view__')||'');v=['log','summary','plan','public'].includes(s)?s:'log'}else{var u=new URL(location.href),q=String(u.searchParams.get('routine-view')||'');if(['log','summary','plan','public'].includes(q))v=q;else if(String(location.hash||'').toLowerCase()==='#tab=routine'){var h=String(sessionStorage.getItem('__bl_skincare_routine_view__')||'');v=['log','summary','plan','public'].includes(h)?h:'log'}}if(v){d.setAttribute('data-initial-skincare-tab','routine');d.setAttribute('data-initial-routine-view',v);sessionStorage.setItem('__bl_skincare_routine_view__',v)}}catch(_e){}}()</script><style id="baseline-skincare-first-paint-style">html[data-initial-skincare-tab="routine"] #system{display:none!important}html[data-initial-skincare-tab="routine"] #routine{display:block!important}html[data-initial-skincare-tab="routine"][data-initial-routine-view] #routine [data-routine-panel]{display:none!important}html[data-initial-skincare-tab="routine"][data-initial-routine-view="log"] #routine [data-routine-panel="log"],html[data-initial-skincare-tab="routine"][data-initial-routine-view="summary"] #routine [data-routine-panel="summary"],html[data-initial-skincare-tab="routine"][data-initial-routine-view="plan"] #routine [data-routine-panel="plan"],html[data-initial-skincare-tab="routine"][data-initial-routine-view="public"] #routine [data-routine-panel="public"]{display:block!important}</style>'''
          if 'id="baseline-skincare-first-paint"' in skin_text:
              raise SystemExit('Skincare head bootstrap already exists unexpectedly')
          marker = '<meta name="description"'
          if skin_text.count(marker) != 1:
              raise SystemExit('Skincare description marker not unique')
          skin_text = skin_text.replace(marker, skin_boot + '\n' + marker, 1)

          routine_marker = '<!-- MY ROUTINE -->'
          start = skin_text.find(routine_marker)
          if start < 0:
              raise SystemExit('Skincare My Routine marker missing')
          close = skin_text.find('</section>\n</main>', start)
          if close < 0:
              raise SystemExit('Skincare My Routine closing section not found')
          panel_sync = '''</section>\n<script id="baseline-skincare-initial-panel">!function(){var v=document.documentElement.getAttribute('data-initial-routine-view');if(!['log','summary','plan','public'].includes(v))return;var r=document.getElementById('routine');if(!r)return;r.querySelectorAll('[data-routine-view]').forEach(function(b){var s=b.getAttribute('data-routine-view')===v;b.classList.toggle('active',s);b.setAttribute('aria-selected',s?'true':'false');if(s)b.removeAttribute('tabindex');else b.setAttribute('tabindex','-1')});r.querySelectorAll('[data-routine-panel]').forEach(function(p){var s=p.getAttribute('data-routine-panel')===v;p.hidden=!s;p.classList.toggle('active',s)})}()</script>'''
          skin_text = skin_text[:close] + panel_sync + skin_text[close+len('</section>'):]

          old_skin_tail = '''<script src="/systems/baseline-natural-skincare/js/skincare-routine-enhancements.js?v=SKINCARE_ROUTINE_LOG_DATES_20260806_1"></script>
<script src="/systems/baseline-natural-skincare/js/skincare-routine.js?v=SKINCARE_ROUTINE_LOG_DATES_20260806_1"></script>'''
          new_skin_tail = '''<script src="/systems/baseline-natural-skincare/js/skincare-routine-enhancements.js?v=SKINCARE_ROUTINE_FIRST_PAINT_20260811_1"></script>
<script src="/sitewide/js/baseline-routine-system.js?v=SITEWIDE_MY_ROUTINE_SYSTEM_20260808_6" data-baseline-routine-system="true" data-loaded="true"></script>
<script src="/systems/baseline-natural-skincare/js/skincare-routine.js?v=SKINCARE_ROUTINE_FIRST_PAINT_20260811_1"></script>
<script src="/systems/baseline-natural-skincare/js/skincare-routine-sitewide-v5.js?v=SKINCARE_SITEWIDE_ROUTINE_20260809_5" data-skincare-routine-sitewide-v5="true" data-loaded="true"></script>
<script src="/sitewide/js/baseline-public-routine-viewonly-v4.js?v=BASELINE_PUBLIC_ROUTINE_VIEWONLY_20260809_2" data-baseline-public-routine-viewonly-v4="true" data-loaded="true"></script>
<script src="/sitewide/js/baseline-routine-coherence-v12.js?v=BASELINE_ROUTINE_COHERENCE_20260810_2" data-baseline-routine-coherence-v12="true" data-loaded="true"></script>'''
          if skin_text.count(old_skin_tail) != 1:
              raise SystemExit(f'Skincare script tail expected once, found {skin_text.count(old_skin_tail)}')
          skin_text = skin_text.replace(old_skin_tail,new_skin_tail,1)
          skin_html.write_text(skin_text)

          # Skincare base: render local state before the first network wait and
          # repaint only when remote state differs.
          skin_js = Path('systems/baseline-natural-skincare/js/skincare-routine.js')
          load_state_pattern = r"  async function loadState\(\) \{.*?\n  \}\n\n  function ensureShell\(\) \{"
          load_state_replacement = '''  function loadLocalState() {
    const local=readLocal();
    if (!local) return;
    state.routine=MODEL.normaliseRoutine(local.routine);
    state.logs=MODEL.normaliseLogs(local.logs);
    state.visibility=local.visibility==='public'?'public':'private';
  }
  async function loadRemoteState() {
    if (!authed()) return false;
    const before=JSON.stringify({ routine:state.routine,logs:state.logs,visibility:state.visibility });
    const response=await request(ROUTINE_API);
    if (response.ok && response.data?.ok) {
      state.routine=MODEL.normaliseRoutine(response.data.routine);
      state.logs=MODEL.normaliseLogs(response.data.logs);
      state.visibility=response.data.visibility==='public'?'public':'private';
      writeLocal();
    }
    const after=JSON.stringify({ routine:state.routine,logs:state.logs,visibility:state.visibility });
    return after!==before;
  }

  function ensureShell() {'''
          sub_once(skin_js, load_state_pattern, load_state_replacement, 'Skincare split local/remote state', re.S)

          init_pattern = r"  async function init\(\) \{.*?\n  \}\n  global\.BASELINE_SKINCARE_ROUTINE="
          init_replacement = '''  async function init() {
    const routing=locationTargetsRoutine();
    state.activeView=routeViewFromLocation();
    try { global.sessionStorage?.setItem(VIEW_KEY,state.activeView); } catch (_error) {}

    ensureShell();
    bindEvents();
    loadLocalState();

    if (routing) {
      selectOuterRoutine();
      activateView(state.activeView,false);
      writeViewRoute(state.activeView);
    }

    const changed=await loadRemoteState();
    if (changed && locationTargetsRoutine()) renderAll();
  }
  global.BASELINE_SKINCARE_ROUTINE='''
          sub_once(skin_js, init_pattern, init_replacement, 'Skincare stable init', re.S)

          print('My Routine first-paint consolidation applied.')
          PY

      - name: Parse changed JavaScript
        run: |
          node --check systems/baseline-fitness/js/fitness-routine-structure-v4.js
          node --check systems/baseline-fitness/js/fitness-routine-workspace-v2.js
          node --check systems/baseline-natural-skincare/js/skincare-routine.js

      - name: Commit consolidation
        run: |
          if git diff --quiet; then
            echo "No changes produced"
            exit 1
          fi
          git config user.name "Baseline Routine Consolidation"
          git config user.email "actions@users.noreply.github.com"
          git add systems/baseline-fitness/baseline-fitness.html \
                  systems/baseline-fitness/js/fitness-routine-structure-v4.js \
                  systems/baseline-fitness/js/fitness-routine-workspace-v2.js \
                  systems/baseline-natural-skincare/baseline-natural-skincare.html \
                  systems/baseline-natural-skincare/js/skincare-routine.js
          git commit -m "Consolidate My Routine first paint"
          git push origin HEAD:main
