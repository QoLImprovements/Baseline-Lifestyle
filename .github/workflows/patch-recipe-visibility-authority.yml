name: Patch recipe visibility authority

on:
  push:
    branches:
      - fix/recipe-details-empty-adjustments-plain-20260824

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[recipe-visibility-authority-patched]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: fix/recipe-details-empty-adjustments-plain-20260824
          fetch-depth: 0

      - name: Apply visibility patch
        run: python3 scripts/patch-recipe-visibility-authority.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitewide/css/baseline-recipes.css
          if git diff --cached --quiet; then
            echo "No visibility changes"
            exit 0
          fi
          git commit -m "Lock universal recipe visibility [recipe-visibility-authority-patched]"
          git push origin HEAD:fix/recipe-details-empty-adjustments-plain-20260824
