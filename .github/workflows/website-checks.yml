name: Website checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: website-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate-routine-systems:
    name: Apply routine systems overhaul
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      target: ${{ steps.gate.outputs.target }}
      changed: ${{ steps.apply.outputs.changed }}

    steps:
      - name: Identify target branch
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.head_ref }}" = "agent/routine-systems-overhaul-20260804" ]; then
            echo "target=true" >> "$GITHUB_OUTPUT"
          else
            echo "target=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out feature branch
        if: steps.gate.outputs.target == 'true'
        uses: actions/checkout@v7
        with:
          ref: agent/routine-systems-overhaul-20260804
          fetch-depth: 0

      - name: Synchronise current main
        if: steps.gate.outputs.target == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Set up Node.js
        if: steps.gate.outputs.target == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Apply migration
        id: apply
        if: steps.gate.outputs.target == 'true'
        run: |
          if [ ! -f scripts/apply_routine_systems_overhaul.py ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          python3 scripts/apply_routine_systems_overhaul.py

      - name: Install locked dependencies
        if: steps.apply.outputs.changed == 'true'
        run: npm ci

      - name: Verify focused implementation
        if: steps.apply.outputs.changed == 'true'
        run: |
          node --check systems/baseline-natural-skincare/js/skincare-routine-catalogue-v2.js
          node --check systems/baseline-natural-skincare/js/skincare-product-library.js
          node --check systems/baseline-natural-skincare/js/skincare-routine-enhancements.js
          node --check systems/baseline-natural-skincare/js/skincare-routine.js
          node --check systems/baseline-fitness/js/fitness-activity-catalogue.js
          node --check systems/baseline-fitness/js/fitness-routine-workspace.js
          php -l systems/baseline-natural-skincare/api/routine_state.php
          php -l systems/baseline-natural-skincare/api/routine_groups.php
          php -l systems/baseline-fitness/api/schema.php
          php -l systems/baseline-fitness/api/routine_state.php
          node --test tests/skincare-routine-overhaul.test.mjs tests/skincare-my-routine.test.mjs tests/skincare-routine-groups-calendar.test.mjs
          node --test tests/fitness-routine-workspace.test.mjs tests/fitness-exercise-catalogue.test.mjs tests/fitness-independent-exercise-progression.test.mjs
          npm run test:structure

      - name: Publish clean verified feature branch
        if: steps.apply.outputs.changed == 'true'
        run: |
          rm -f scripts/apply_routine_systems_overhaul.py
          rm -f .github/workflows/apply-routine-systems-overhaul.yml
          echo '' | base64 -d > .github/workflows/website-checks.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand skincare and Fitness routine systems"
          git push origin HEAD:agent/routine-systems-overhaul-20260804

  validate:
    name: Validate website
    needs: migrate-routine-systems
    if: ${{ always() && !(needs.migrate-routine-systems.outputs.target == 'true' && needs.migrate-routine-systems.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run structure safeguards
        run: npm test

      - name: Run Fitness and voice unit tests
        run: npm run test:fitness

      - name: Install Chromium for voice UI checks
        run: npx playwright install --with-deps chromium

      - name: Run Fitness voice browser test
        run: npm run test:voice-ui

      - name: Run finite stability and release smoke test
        run: npm run test:stability-smoke

      - name: Run Games Hub unit tests
        run: npm run test:realm-stage2

      - name: Lint PHP endpoints
        run: find sitewide systems -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Exercise saved-data atomic-write contract
        run: npm run test:saved-data-php
