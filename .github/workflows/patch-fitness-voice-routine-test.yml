name: Patch Fitness voice routine navigation test

on:
  push:
    branches:
      - agent/routine-systems-overhaul-20260804
    paths:
      - .github/workflows/patch-fitness-voice-routine-test.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/routine-systems-overhaul-20260804
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Update voice browser workflow for the Calisthenics subtab
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/baseline-fitness-voice.spec.js')
          text = path.read_text()
          old = '''  await page.waitForFunction(() =>
    Boolean(
      window.BASELINE_fitnessWorkout &&
        window.BASELINE_voice &&
        window.BASELINE_fitnessVoice,
    ),
  );
  await expect(page.locator("#startVoiceWorkoutBtn")).toBeVisible();'''
          new = '''  await page.waitForFunction(() =>
    Boolean(
      window.BASELINE_fitnessWorkout &&
        window.BASELINE_voice &&
        window.BASELINE_fitnessVoice,
    ),
  );
  await expect(page.locator('[data-fitness-routine-view="calisthenics"]')).toBeVisible();
  await page.locator('[data-fitness-routine-view="calisthenics"]').click();
  await expect(page.locator("#startVoiceWorkoutBtn")).toBeVisible();'''
          if old not in text:
              raise SystemExit('voice test insertion point not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify voice browser workflow
        run: npm run test:voice-ui

      - name: Commit clean test update
        run: |
          rm .github/workflows/patch-fitness-voice-routine-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Navigate to Calisthenics in the voice workout test"
          git push origin HEAD:agent/routine-systems-overhaul-20260804
