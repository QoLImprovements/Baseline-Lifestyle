name: Apply skincare routine calendar and groups

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-skincare-routine-calendar-groups.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Write enhancement files and patch page
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import base64, gzip, json

          encoded = {
            "systems/baseline-natural-skincare/js/skincare-routine-enhancements.js": "",
            "systems/baseline-natural-skincare/css/skincare-routine-enhancements.css": "",
            "systems/baseline-natural-skincare/api/routine_groups.php": "",
            "tests/skincare-routine-groups-calendar.test.mjs": "",
            "systems/baseline-natural-skincare/api/schema.php": ""
          }
          for relative, payload in encoded.items():
              path = Path(relative)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(gzip.decompress(base64.b64decode(payload)))

          html_path = Path('systems/baseline-natural-skincare/baseline-natural-skincare.html')
          html = html_path.read_text()
          routine_css = '<link href="/systems/baseline-natural-skincare/css/skincare-routine.css?v=SKINCARE_ROUTINE_WORKSPACE_20260804_1" rel="stylesheet"/>'
          enhancement_css = '<link href="/systems/baseline-natural-skincare/css/skincare-routine-enhancements.css?v=SKINCARE_ROUTINE_CALENDAR_GROUPS_20260804_1" rel="stylesheet"/>'
          if enhancement_css not in html:
              if routine_css not in html: raise SystemExit('routine CSS anchor missing')
              html = html.replace(routine_css, routine_css + chr(10) + enhancement_css, 1)

          model_script = '<script src="/systems/baseline-natural-skincare/js/skincare-routine-model.js?v=SKINCARE_ROUTINE_WORKSPACE_20260804_1"></script>'
          interface_script = '<script src="/systems/baseline-natural-skincare/js/skincare-routine.js?v=SKINCARE_ROUTINE_WORKSPACE_20260804_1"></script>'
          enhancement_script = '<script src="/systems/baseline-natural-skincare/js/skincare-routine-enhancements.js?v=SKINCARE_ROUTINE_CALENDAR_GROUPS_20260804_1"></script>'
          if enhancement_script not in html:
              anchor = model_script + chr(10) + interface_script
              if anchor not in html: raise SystemExit('routine script anchor missing')
              html = html.replace(anchor, model_script + chr(10) + enhancement_script + chr(10) + interface_script, 1)

          html = html.replace('data-routine-view="summary" tabindex="-1">My Routine</button>', 'data-routine-view="summary" tabindex="-1">Routine Summary</button>', 1)
          old_summary = '''<div class="routine-summary-head">
<div>
<h2>My Routine</h2>
<h3>Routine summary</h3>
<p class="note">Build a personal self-care plan with a place and frequency for each action. The plan can remain private or be shared publicly, while your completion log always stays private.</p>
</div>
<select id="routineVisibility" class="routine-visibility-select" aria-label="Routine visibility">
<option value="private">Private</option>
<option value="public">Public</option>
</select>
</div>'''
          new_summary = '''<div class="routine-summary-head">
<div>
<h2>Routine Summary</h2>
<p class="note">A complete view of every routine action, its schedule, benefits and personal notes. The plan may remain private or be shared publicly, while the completion log always stays private.</p>
</div>
<label class="routine-visibility-control"><span>Routine Visibility</span><select id="routineVisibility" class="routine-visibility-select" aria-label="Routine visibility">
<option value="private">Private</option>
<option value="public">Public</option>
</select></label>
</div>'''
          if old_summary in html:
              html = html.replace(old_summary, new_summary, 1)
          elif '<h2>Routine Summary</h2>' not in html:
              raise SystemExit('routine summary block missing')
          html_path.write_text(html)

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          test_file = 'tests/skincare-routine-groups-calendar.test.mjs'
          structure = package['scripts']['test:structure']
          if test_file not in structure:
              package['scripts']['test:structure'] = structure + ' ' + test_file
          package_path.write_text(json.dumps(package, indent=2) + chr(10))
          PYCODE

      - name: Install locked dependencies
        run: npm ci

      - name: Verify skincare implementation
        run: |
          node --check systems/baseline-natural-skincare/js/skincare-routine-enhancements.js
          php -l systems/baseline-natural-skincare/api/schema.php
          php -l systems/baseline-natural-skincare/api/routine_groups.php
          node --test tests/skincare-my-routine.test.mjs tests/skincare-routine-groups-calendar.test.mjs
          npm run test:structure

      - name: Commit verified implementation
        run: |
          rm .github/workflows/apply-skincare-routine-calendar-groups.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add skincare routine calendar and groups [skip ci]"
          git push origin HEAD:main
