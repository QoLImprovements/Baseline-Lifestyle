name: One-shot fix Routine Log completed session

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-fix-routine-log-session-attribution-20260828.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix completed session attribution
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('systems/baseline-fitness/js/baseline-fitness-app.js')
          text = path.read_text(encoding='utf-8')

          old = """    removeStorage(stepStorageKey(current.planId, context.sessionIndex));
    renderSavedPlanHeader(); renderPlanSubtab('current'); renderAchievements(); notifyWorkout();
    return workoutContext();
"""
          new = """    const completedSession = { planId:current.planId, sessionIndex:context.sessionIndex, completionDate };
    removeStorage(stepStorageKey(current.planId, context.sessionIndex));
    cachePlan(current);
    await global.BASELINE_fitnessPlans?.refresh?.();
    global.BASELINE_fitnessRoutine?.render?.();
    renderSavedPlanHeader(); renderPlanSubtab('current'); renderAchievements();
    try { document.dispatchEvent(new CustomEvent('baseline:fitness-workout-completed', { detail:Object.assign({ source:'finish-current-workout' }, completedSession) })); } catch (_error) {}
    notifyWorkout();
    return workoutContext();
"""

          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one finishCurrentWorkout completion tail, found {count}')

          text = text.replace(old, new, 1)
          text = text.replace(
              "const BUILD = 'BASELINE_FITNESS_COMPLETED_BADGE_20260828_1';",
              "const BUILD = 'BASELINE_FITNESS_ROUTINE_LOG_SESSION_ATTRIBUTION_20260828_1';",
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify completed session remains authoritative
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('systems/baseline-fitness/js/baseline-fitness-app.js').read_text(encoding='utf-8')
          assert "const completedSession = { planId:current.planId, sessionIndex:context.sessionIndex, completionDate };" in text
          assert "await global.BASELINE_fitnessPlans?.refresh?.();" in text
          assert "global.BASELINE_fitnessRoutine?.render?.();" in text
          assert "baseline:fitness-workout-completed" in text
          PY

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-fix-routine-log-session-attribution-20260828.yml
          git add systems/baseline-fitness/js/baseline-fitness-app.js
          git diff --cached --check
          git commit -m "Fix Routine Log completed session attribution"
          git push origin HEAD:main
