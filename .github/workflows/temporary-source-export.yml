name: Temporary source export

on:
  push:
    branches:
      - agent/saved-data-completion-20260823
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source
        run: tar --exclude=.git -czf /tmp/baseline-source.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: baseline-source
          path: /tmp/baseline-source.tgz
          retention-days: 1
