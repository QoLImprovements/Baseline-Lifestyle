name: Apply storage map fix

on:
  push:
    branches:
      - agent/fix-live-refresh-and-persistence-20260802
    paths:
      - .github/scripts/apply_storage_map_fix.py
      - .github/workflows/apply-storage-map-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/apply_storage_map_fix.py
      - name: Commit mapping decision
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Map live stability session storage"
          git push
