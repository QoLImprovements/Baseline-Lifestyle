name: Validate routine systems overhaul

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/validate-routine-overhaul.yml

permissions:
  contents: write

jobs:
  validate-feature-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out routine-systems feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/routine-systems-overhaul-20260804
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run structure safeguards
        run: npm test

      - name: Run Fitness and voice unit tests
        run: npm run test:fitness

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Fitness voice browser test
        run: npm run test:voice-ui

      - name: Run stability smoke test
        run: npm run test:stability-smoke

      - name: Run Games Hub tests
        run: npm run test:realm-stage2

      - name: Lint PHP endpoints
        run: find sitewide systems -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Exercise saved-data atomic-write contract
        run: npm run test:saved-data-php

      - name: Record successful validation on the feature branch
        run: |
          printf 'Validated full Website checks at %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > ROUTINE_SYSTEMS_VALIDATED
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROUTINE_SYSTEMS_VALIDATED
          git commit -m "Record successful routine systems validation"
          git push origin HEAD:agent/routine-systems-overhaul-20260804
