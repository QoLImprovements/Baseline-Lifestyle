name: Website checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: website-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  correct-skincare-visuals:
    name: Correct skincare visuals
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      target: ${{ steps.gate.outputs.target }}
      changed: ${{ steps.apply.outputs.changed }}

    steps:
      - name: Identify correction branch
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.head_ref }}" = "agent/fix-skincare-dropdown-calendar-20260804" ]; then
            echo "target=true" >> "$GITHUB_OUTPUT"
          else
            echo "target=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out correction branch
        if: steps.gate.outputs.target == 'true'
        uses: actions/checkout@v7
        with:
          ref: agent/fix-skincare-dropdown-calendar-20260804
          fetch-depth: 0

      - name: Set up Node.js
        if: steps.gate.outputs.target == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Apply correction
        id: apply
        if: steps.gate.outputs.target == 'true'
        run: |
          if grep -q 'SKINCARE_ROUTINE_VISUAL_CORRECTION_20260804_2' systems/baseline-natural-skincare/css/skincare-routine-enhancements.css; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          from pathlib import Path

          css_path = Path('systems/baseline-natural-skincare/css/skincare-routine-enhancements.css')
          css = css_path.read_text()
          correction = '''

/* SKINCARE_ROUTINE_VISUAL_CORRECTION_20260804_2 */
/* Keep the action list above every routine card and make every list surface fully opaque. */
#routine .routine-add-row{position:relative!important;z-index:500!important;isolation:isolate!important;}
#routine .routine-action-combobox{position:relative!important;z-index:501!important;isolation:isolate!important;}
#routine .routine-items{position:relative!important;z-index:1!important;}
#routine .routine-action-menu{
  z-index:1000!important;
  opacity:1!important;
  background:var(--skin-cream)!important;
  background-color:var(--skin-cream)!important;
  background-image:none!important;
  -webkit-backdrop-filter:none!important;
  backdrop-filter:none!important;
  filter:none!important;
  mix-blend-mode:normal!important;
  isolation:isolate!important;
  box-shadow:0 24px 52px -20px #7a4a3a!important;
}
#routine .routine-action-group,
#routine .routine-action-group-label,
#routine .routine-action-option,
#routine .routine-action-no-results{
  opacity:1!important;
  background:var(--skin-cream)!important;
  background-color:var(--skin-cream)!important;
  background-image:none!important;
  -webkit-backdrop-filter:none!important;
  backdrop-filter:none!important;
  filter:none!important;
  mix-blend-mode:normal!important;
  color:var(--ink)!important;
}
#routine .routine-action-group-label{background:var(--skin-milk)!important;color:var(--accent-2)!important;}
#routine .routine-action-option:hover,
#routine .routine-action-option:focus,
#routine .routine-action-option[aria-selected="true"]{background:var(--skin-wash)!important;color:var(--ink)!important;}
#routine select,#routine select option,#routine select optgroup{opacity:1!important;background-color:var(--skin-cream)!important;color:var(--ink)!important;}

/* Use only the established mirrored terracotta skincare colours in the calendar. */
#routine .routine-calendar-card{background:var(--skin-page-gradient)!important;}
#routine .routine-calendar-weekdays span,#routine .routine-calendar-nav strong{color:var(--ink)!important;}
#routine .routine-calendar-nav button{
  background:linear-gradient(180deg,var(--skin-cream),var(--skin-milk))!important;
  border-color:var(--skin-peach)!important;
  color:var(--ink)!important;
}
#routine .routine-calendar-day{
  background:linear-gradient(180deg,var(--skin-cream),var(--skin-milk))!important;
  border-color:var(--skin-peach)!important;
  color:var(--ink)!important;
}
#routine .routine-calendar-day:hover{
  background:linear-gradient(180deg,var(--skin-milk),var(--skin-wash))!important;
  border-color:var(--skin-deep)!important;
}
#routine .routine-calendar-day.has-routine{
  background:linear-gradient(180deg,var(--skin-wash),var(--skin-peach))!important;
  border-color:var(--skin-deep)!important;
}
#routine .routine-calendar-day.selected{
  background:linear-gradient(180deg,var(--skin-peach),var(--skin-deep))!important;
  border-color:var(--skin-deep)!important;
  outline:3px solid var(--skin-deep)!important;
}
#routine .routine-calendar-count{background:var(--skin-deep)!important;color:#fff7f2!important;}
#routine .routine-calendar-empty{background:transparent!important;}
'''
          css_path.write_text(css.rstrip() + correction)

          old = 'SKINCARE_ROUTINE_CALENDAR_GROUPS_20260804_1'
          new = 'SKINCARE_ROUTINE_CALENDAR_GROUPS_20260804_2'
          html_path = Path('systems/baseline-natural-skincare/baseline-natural-skincare.html')
          html = html_path.read_text()
          if old not in html and new not in html:
              raise SystemExit('Skincare enhancement cache key not found')
          html_path.write_text(html.replace(old, new))

          test_path = Path('tests/skincare-routine-groups-calendar.test.mjs')
          test_path.write_text(test_path.read_text().replace(old, new))
          PY

      - name: Install locked dependencies
        if: steps.apply.outputs.changed == 'true'
        run: npm ci

      - name: Verify correction
        if: steps.apply.outputs.changed == 'true'
        run: |
          node --test tests/skincare-routine-groups-calendar.test.mjs tests/skincare-my-routine.test.mjs
          npm run test:structure
          grep -q 'z-index:1000!important' systems/baseline-natural-skincare/css/skincare-routine-enhancements.css
          grep -q 'background:var(--skin-page-gradient)!important' systems/baseline-natural-skincare/css/skincare-routine-enhancements.css

      - name: Publish clean verified branch
        if: steps.apply.outputs.changed == 'true'
        run: |
          rm -f .github/workflows/fix-skincare-dropdown-calendar.yml
          rm -f TEMP_SKINCARE_VISUAL_FIX
          echo '' | base64 -d > .github/workflows/website-checks.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix skincare dropdown layering and calendar palette"
          git push origin HEAD:agent/fix-skincare-dropdown-calendar-20260804

  validate:
    name: Validate website
    needs: correct-skincare-visuals
    if: ${{ always() && !(needs.correct-skincare-visuals.outputs.target == 'true' && needs.correct-skincare-visuals.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run structure safeguards
        run: npm test

      - name: Run Fitness and voice unit tests
        run: npm run test:fitness

      - name: Install Chromium for voice UI checks
        run: npx playwright install --with-deps chromium

      - name: Run Fitness voice browser test
        run: npm run test:voice-ui

      - name: Run finite stability and release smoke test
        run: npm run test:stability-smoke

      - name: Run Games Hub unit tests
        run: npm run test:realm-stage2

      - name: Lint PHP endpoints
        run: find sitewide systems -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Exercise saved-data atomic-write contract
        run: npm run test:saved-data-php
