name: Apply skincare routine route fix

on:
  push:
    branches:
      - agent/fix-skincare-routine-route-and-categories-20260804
    paths:
      - .github/workflows/apply-skincare-routine-route-fix.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-skincare-routine-route-and-categories-20260804
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply route and dropdown migration
        run: python3 .github/apply_skincare_routine_route_fix.py

      - name: Check JavaScript syntax
        run: |
          node --check systems/baseline-natural-skincare/js/skincare-routine-model.js
          node --check systems/baseline-natural-skincare/js/skincare-routine.js

      - name: Run focused regression tests
        run: node --test tests/skincare-my-routine.test.mjs tests/site-structure-integrity.test.mjs

      - name: Commit verified implementation
        run: |
          rm .github/apply_skincare_routine_route_fix.py
          rm .github/workflows/apply-skincare-routine-route-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix skincare routine refresh and expand action categories"
          git push origin HEAD:agent/fix-skincare-routine-route-and-categories-20260804
