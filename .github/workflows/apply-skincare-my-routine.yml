name: Apply skincare My Routine

on:
  push:
    branches:
      - agent/skincare-my-routine-20260804
    paths:
      - .github/workflows/apply-skincare-my-routine.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/skincare-my-routine-20260804
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply My Routine migration
        run: python3 scripts/apply_skincare_my_routine.py

      - name: Check JavaScript syntax
        run: |
          node --check systems/baseline-natural-skincare/js/skincare-routine-model.js
          node --check systems/baseline-natural-skincare/js/skincare-routine.js
          node --check sitewide/js/baseline-shared.js
          node --check sitewide/js/baseline-tabs.js

      - name: Check PHP syntax
        run: |
          php -l systems/baseline-natural-skincare/api/schema.php
          php -l systems/baseline-natural-skincare/api/routine_state.php

      - name: Run My Routine regression tests
        run: node --test tests/skincare-my-routine.test.mjs

      - name: Commit verified implementation
        run: |
          rm scripts/apply_skincare_my_routine.py
          rm .github/workflows/apply-skincare-my-routine.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add skincare My Routine planner and log"
          git push origin HEAD:agent/skincare-my-routine-20260804
