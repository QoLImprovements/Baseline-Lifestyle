name: Publish clean voice settings branch

on:
  push:
    branches:
      - agent/refine-fitness-voice-settings-20260803
    paths:
      - .github/workflows/publish-clean-voice-settings-branch.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create a clean single-commit branch from main
        run: |
          SOURCE_BRANCH="agent/refine-fitness-voice-settings-20260803"
          CLEAN_BRANCH="agent/refine-fitness-voice-settings-clean-20260803"
          git fetch origin main "$SOURCE_BRANCH"
          git switch --force-create "$CLEAN_BRANCH" origin/main
          git checkout "origin/$SOURCE_BRANCH" -- \
            sitewide/css/baseline-ui-fixes.css \
            sitewide/js/baseline-voice.js \
            systems/baseline-fitness/baseline-fitness.html \
            tests/baseline-fitness-voice.spec.js \
            tests/fitness-voice-fallback-contract.test.mjs \
            tests/site-structure-integrity.test.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine Fitness voice settings layout and copy"
          git push --force origin "HEAD:$CLEAN_BRANCH"
