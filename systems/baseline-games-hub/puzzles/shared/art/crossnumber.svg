<rect width="240" height="240" rx="34" fill="url(#bg)"/>
<circle cx="190" cy="46" r="58" fill="#8aa0ff" opacity=".14"/>
<g transform="translate(30 40)" stroke="#0d1535" stroke-width="3">
  <g fill="url(#n)"><rect x="0" y="0" width="34" height="34" rx="6"/><rect x="72" y="0" width="34" height="34" rx="6"/><rect x="144" y="0" width="34" height="34" rx="6"/><rect x="72" y="72" width="34" height="34" rx="6"/><rect x="144" y="72" width="34" height="34" rx="6"/><rect x="144" y="144" width="34" height="34" rx="6"/></g>
