name: Skincare targeted PR checks

on:
  push:
    branches:
      - skincare-new-recipes-and-cleanser-sliders

permissions:
  contents: read

jobs:
  skincare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run Skincare structural contracts that are independently green
        run: |
          node --test             tests/skincare-ingredient-conversion-coverage.test.mjs             tests/browser-storage-inventory.test.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Skincare recipe browser regressions
        run: |
          npx playwright test             tests/skincare-recipe-runtime.spec.js             tests/skincare-testing-recipes-browser.spec.js             --reporter=line
