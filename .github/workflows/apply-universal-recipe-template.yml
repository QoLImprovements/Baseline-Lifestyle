name: Apply universal recipe template

on:
  push:
    branches:
      - feat/universal-recipe-template-20260824

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[universal-recipe-applied]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: feat/universal-recipe-template-20260824
          fetch-depth: 0

      - name: Apply universal recipe template patch
        run: python3 scripts/apply-universal-recipe-template.py

      - name: Commit generated recipe-template changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitewide/js/baseline-shared.js sitewide/css/baseline-recipes.css
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Apply universal recipe template [universal-recipe-applied]"
          git push origin HEAD:feat/universal-recipe-template-20260824
