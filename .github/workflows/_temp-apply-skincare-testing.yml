name: Temporary apply Skincare Testing recipes

on:
  push:
    branches:
      - fix/skincare-testing-embedded-20260823
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/skincare-testing-embedded-20260823' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: fix/skincare-testing-embedded-20260823
          fetch-depth: 0

      - name: Tighten one-shot recipe-card validation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/apply-skincare-testing-recipes.py')
          text = p.read_text(encoding='utf-8')
          old = '''for token in ('id="r8"', 'id="r9"', 'id="r10"', 'data-recipe-slug="testing-shaving-gel"', 'data-recipe-slug="testing-natural-tooth-brightening-powder"', 'data-recipe-slug="testing-microcurrent-conductive-gel"'):\n    if html.count(token) != 1:\n        raise SystemExit(f'embedded recipe validation failed for {token}: {html.count(token)} occurrences')'''
          new = '''for token in (\n    '<div class="recipe card recipe-page" data-recipe-slug="testing-shaving-gel" id="r8">',\n    '<div class="recipe card recipe-page" data-recipe-slug="testing-natural-tooth-brightening-powder" id="r9">',\n    '<div class="recipe card recipe-page" data-recipe-slug="testing-microcurrent-conductive-gel" id="r10">',\n):\n    if html.count(token) != 1:\n        raise SystemExit(f'embedded recipe validation failed for {token}: {html.count(token)} occurrences')'''
          if old not in text:
              raise SystemExit('one-shot validation block not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply embedded recipe patch
        run: python tools/apply-skincare-testing-recipes.py

      - name: Remove temporary patch machinery
        run: |
          git rm -f tools/apply-skincare-testing-recipes.py
          git rm -f .github/workflows/_temp-apply-skincare-testing.yml

      - name: Commit patched site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Embed Testing recipes in canonical Skincare recipe system"
          git push origin HEAD:fix/skincare-testing-embedded-20260823
