name: One-shot remove My Routine inline critical CSS

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Move first-paint visibility fully into system CSS
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          changes = [
              (
                  Path('systems/baseline-fitness/baseline-fitness.html'),
                  'baseline-fitness-first-paint-style',
                  'fitness-routine-workspace.css?v=BASELINE_FITNESS_ROUTINE_WORKSPACE_20260806_1',
                  'fitness-routine-workspace.css?v=BASELINE_FITNESS_ROUTINE_WORKSPACE_20260811_1',
              ),
              (
                  Path('systems/baseline-natural-skincare/baseline-natural-skincare.html'),
                  'baseline-skincare-first-paint-style',
                  'skincare-routine-workspace-v2.css?v=SKINCARE_ROUTINE_WORKSPACE_V2_20260804_1',
                  'skincare-routine-workspace-v2.css?v=SKINCARE_ROUTINE_FIRST_PAINT_20260811_1',
              ),
          ]

          for path, style_id, old_key, new_key in changes:
              text = path.read_text()
              text, count = re.subn(
                  rf'<style id="{re.escape(style_id)}">[\s\S]*?</style>',
                  '',
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f'{path}: expected one {style_id}, found {count}')
              if text.count(old_key) != 1:
                  raise SystemExit(f'{path}: expected one old cache key')
              text = text.replace(old_key, new_key, 1)
              path.write_text(text)
          PY

      - name: Commit cleanup to main
        run: |
          git config user.name "Baseline Routine Cleanup"
          git config user.email "actions@users.noreply.github.com"
          git add systems/baseline-fitness/baseline-fitness.html systems/baseline-natural-skincare/baseline-natural-skincare.html
          git commit -m "Move My Routine first-paint visibility into system CSS"
          git push origin HEAD:main
