name: Realm PR verification

on:
  push:
    branches:
      - realm-stability-phase1-20261004

permissions:
  contents: read

jobs:
  realm:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run Realm unit tests
        run: npm run test:realm-stage2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run targeted Realm browser verification
        run: >
          npx playwright test
          tests/baseline-realm-meridian-grove-live.spec.js
          tests/baseline-realm-integration.spec.js
          tests/baseline-games-hub-startup-resilience.spec.js
          --grep="Meridian Grove resumes an ATB battle with all six commands|Basecamp landmarks enter external games and reliably return to the hub|Realm opens at Basecamp and Ninja actors and controls work after explicit entry"
          --workers=3
          --reporter=line
