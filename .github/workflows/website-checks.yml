name: Website checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: website-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run structure safeguards
        run: |
          set -o pipefail
          npm test 2>&1 | tee structure-test-output.txt

      - name: Preserve structure failure output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: structure-failure-output
          path: structure-test-output.txt
          if-no-files-found: ignore
          retention-days: 1

      - name: Run Fitness and voice unit tests
        run: npm run test:fitness && npm run test:voice

      - name: Install Chromium for browser checks
        if: always()
        run: npx playwright install --with-deps chromium

      - name: Run Baseline Realm browser checks
        id: realm_checks
        continue-on-error: true
        run: npm run test:realm-stage1 && npm run test:realm-integration

      - name: Run Badminton Session score authorization browser test
        if: always()
        run: npx playwright test tests/badminton-session-score-auth.spec.js --reporter=line

      - name: Run Fitness voice browser test
        run: npm run test:voice-ui

      - name: Run Phase 3 first-half contract verification
        run: |
          node --test \
            tests/resource-authority-contract.test.mjs \
            tests/browser-storage-inventory.test.mjs \
            tests/games-server-storage.test.mjs \
            tests/persistent-browser-revision-contract.test.mjs \
            tests/baseline-api-client.test.mjs
          php tests/resource-authority-contract.php

      - name: Run Phase 3 second-half regression verification
        run: |
          node --test \
            tests/public-routine-calendar-sync.test.mjs \
            tests/public-routine-summary-mirror.test.mjs \
            tests/site-structure-integrity.test.mjs \
            tests/live-stability-contract.test.mjs
          npx playwright test \
            tests/baseline-fitness-voice.spec.js \
            tests/fitness-saved-plan-reload-browser.spec.js \
            tests/routine-system-browser.spec.js \
            tests/skincare-recipe-runtime.spec.js \
            tests/stability-release-smoke.spec.js \
            tests/navigation-state-browser.spec.js \
            --reporter=line

      - name: Run Phase 3 migration and cutover PHP verification
        run: npm run test:migration-exporter

      - name: Run finite stability, release and routine interaction smoke tests
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-results.json
        run: npx playwright test tests/stability-release-smoke.spec.js tests/routine-system-browser.spec.js tests/fitness-saved-plan-reload-browser.spec.js tests/skincare-testing-recipes-browser.spec.js tests/universal-recipe-template.spec.js --reporter=line,json

      - name: Preserve browser failure report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-report
          path: |
            playwright-results.json
            test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Run Games Hub unit tests
        if: always()
        run: npm run test:games-hub

      - name: Run Badminton Games Hub browser smoke
        if: always()
        run: npx playwright test tests/badminton-focused-browser.spec.js --reporter=line

      - name: Run Darts Games Hub browser smoke
        if: always()
        run: npx playwright test tests/darts-focused-browser.spec.js --reporter=line

      - name: Lint PHP endpoints
        run: |
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' \
            -not -path './vendor/*' \
            -not -path './node_modules/*' \
            -print0)

      - name: Exercise saved-data atomic-write contract
        run: npm run test:saved-data-php

      - name: Preserve Realm failure status
        if: ${{ always() && steps.realm_checks.outcome == 'failure' }}
        run: |
          echo "::error::Baseline Realm browser checks failed earlier in this job."
          exit 1
