name: Fix universal recipe view CSS

on:
  push:
    branches:
      - feat/universal-recipe-template-20260824

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[recipe-view-css-fixed]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: feat/universal-recipe-template-20260824
          fetch-depth: 0

      - name: Apply CSS fix
        run: python3 scripts/fix-universal-recipe-view-css.py

      - name: Commit CSS fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitewide/css/baseline-recipes.css
          if git diff --cached --quiet; then
            echo "No CSS changes"
            exit 0
          fi
          git commit -m "Fix universal recipe view visibility [recipe-view-css-fixed]"
          git push origin HEAD:feat/universal-recipe-template-20260824
