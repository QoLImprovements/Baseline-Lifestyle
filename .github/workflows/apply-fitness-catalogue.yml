name: Apply fitness exercise catalogue

on:
  push:
    branches:
      - agent/fitness-exercise-catalogue-20260804
    paths:
      - .github/workflows/apply-fitness-catalogue.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fitness-exercise-catalogue-20260804
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply catalogue migration
        run: python3 scripts/apply_fitness_catalogue.py

      - name: Check JavaScript syntax
        run: |
          node --check systems/baseline-fitness/js/fitness-exercise-catalogue.js
          node --check systems/baseline-fitness/js/baseline-fitness-app.js
          node --check systems/baseline-fitness/js/fitness-saved-data-bridge.js
          node --check systems/baseline-fitness/js/baseline-fitness-voice.js

      - name: Run fitness regression tests
        run: node --test tests/fitness-exercise-catalogue.test.mjs tests/fitness-independent-exercise-progression.test.mjs

      - name: Commit clean implementation
        run: |
          rm scripts/apply_fitness_catalogue.py
          rm .github/workflows/apply-fitness-catalogue.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add grouped exercise catalogue and burnout hold progression"
          git push origin HEAD:agent/fitness-exercise-catalogue-20260804
