name: Fix Charity Shop account coherence

on:
  push:
    paths:
      - .github/workflows/fix-charity-account-coherence.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve shared header controls
        run: |
          python - <<'PY'
          from pathlib import Path

          old_build = 'BASELINE_PROTECTED_ACCESS_20260730_9'
          new_build = 'BASELINE_PROTECTED_ACCESS_20260730_10'

          protected_js = Path('sitewide/js/baseline-protected-access.js')
          text = protected_js.read_text(encoding='utf-8')
          text = text.replace("const BUILD = '" + old_build + "';", "const BUILD = '" + new_build + "';", 1)

          old_link = "      '    <a class=\"bl-pages-link\" role=\"menuitem\" href=\"/home/1\">Home</a>',\n"
          new_link = old_link + "      '    <a class=\"bl-pages-link\" role=\"menuitem\" aria-current=\"page\" href=\"/baseline-charity-shop/guidance\">Charity Shop</a>',\n"
          if '/baseline-charity-shop/guidance\">Charity Shop</a>' not in text:
              if old_link not in text:
                  raise SystemExit('Could not find the protected menu Home link.')
              text = text.replace(old_link, new_link, 1)

          old_replace = """      if(!existingDropdown || !currentButton || !/^Charity Shop\\b/.test(currentButton.textContent || '')){
        homebarInner.innerHTML = ordinarySectionMenu();
      }
      bindSectionDropdown(homebarInner.querySelector('.bl-pages-dd'));
"""
          new_replace = """      if(!existingDropdown || !currentButton || !/^Charity Shop\\b/.test(currentButton.textContent || '')){
        const template = document.createElement('div');
        template.innerHTML = ordinarySectionMenu();
        const replacementDropdown = template.firstElementChild;
        if(replacementDropdown){
          if(existingDropdown){
            existingDropdown.replaceWith(replacementDropdown);
          }else{
            const sharedControls = homebarInner.querySelector('.bl-homebar-spacer, .bl-homebar-right');
            homebarInner.insertBefore(replacementDropdown, sharedControls || homebarInner.firstChild || null);
          }
        }
      }
      document.querySelectorAll('.charity-homebar-actions').forEach(function(group){ group.remove(); });
      bindSectionDropdown(homebarInner.querySelector('.bl-pages-dd'));
"""
          if old_replace not in text:
              raise SystemExit('Could not find the destructive Charity Shop header replacement.')
          text = text.replace(old_replace, new_replace, 1)
          protected_js.write_text(text, encoding='utf-8')

          charity_php = Path('systems/charity-shop/charity-shop.php')
          text = charity_php.read_text(encoding='utf-8')
          old_header = """    <div class=\"bl-homebar-inner\">
      <div class=\"charity-homebar-actions\">
        <span class=\"charity-access-label\" aria-label=\"Protected website section\">Protected section</span>
        <button class=\"bl-mini-btn\" id=\"charityLockBtn\" type=\"button\">Lock &amp; return home</button>
      </div>
    </div>
"""
          new_header = """    <div class=\"bl-homebar-inner\">
      <div class=\"bl-pages-dd\" data-protected-current-section=\"charity-shop\">
        <button class=\"bl-mini-btn bl-pages-btn\" id=\"bl-pages-toggle\" type=\"button\" aria-haspopup=\"menu\" aria-expanded=\"false\">Charity Shop &#9662;</button>
        <div class=\"bl-pages-menu\" role=\"menu\" hidden>
          <a class=\"bl-pages-link\" role=\"menuitem\" href=\"/home/1\">Home</a>
          <a class=\"bl-pages-link\" role=\"menuitem\" aria-current=\"page\" href=\"/baseline-charity-shop/guidance\">Charity Shop</a>
          <a class=\"bl-pages-link\" role=\"menuitem\" href=\"/baseline-food-approach/system\">Baseline Food Approach</a>
          <a class=\"bl-pages-link\" role=\"menuitem\" href=\"/baseline-massage/system\">Baseline Massage</a>
          <a class=\"bl-pages-link\" role=\"menuitem\" href=\"/baseline-natural-skincare/system\">Baseline Natural Skincare</a>
          <a class=\"bl-pages-link\" role=\"menuitem\" href=\"/baseline-fitness/system\">Baseline Fitness</a>
          <a class=\"bl-pages-link\" role=\"menuitem\" href=\"/baseline-badminton-session/system\">Baseline Badminton Session</a>
          <a class=\"bl-pages-link\" role=\"menuitem\" href=\"/baseline-games-hub/games-hub\">Baseline Games Hub</a>
        </div>
      </div>
    </div>
"""
          if old_header not in text:
              raise SystemExit('Could not find the Charity Shop legacy homebar markup.')
          charity_php.write_text(text.replace(old_header, new_header, 1), encoding='utf-8')

          text_suffixes = {'.html', '.htm', '.php', '.js', '.css', '.md', '.json', '.yml', '.yaml', '.txt'}
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path == protected_js:
                  continue
              if path.name != '.htaccess' and path.suffix.lower() not in text_suffixes:
                  continue
              try:
                  current = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = current.replace(old_build, new_build)
              if updated != current:
                  path.write_text(updated, encoding='utf-8')

          workflow = Path('.github/workflows/fix-charity-account-coherence.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Commit correction
        run: |
          git config user.name "Baseline Lifestyle Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "Restore shared account controls in Charity Shop"
          git push origin HEAD:main
