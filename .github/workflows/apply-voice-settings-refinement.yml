name: Apply voice settings refinement

on:
  push:
    branches:
      - agent/refine-fitness-voice-settings-20260803
    paths:
      - .github/scripts/apply_voice_settings_refinement.py
      - .github/workflows/apply-voice-settings-refinement.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/apply_voice_settings_refinement.py
      - name: Commit refined voice settings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine Fitness voice settings layout and copy"
          git push
