name: One-shot fix skincare ingredient conversions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-fix-skincare-conversions-20260828.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix cucumber seed oil conversion and audit every skincare ingredient
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          profiles_path = Path('sitewide/js/baseline-ingredient-profiles.js')
          profiles = profiles_path.read_text(encoding='utf-8')

          old = '''    "ing-cucumber": withDerived({
                label: "Cucumber juice",
                g_per_ml: 1.0
              }),'''
          # Tolerate normal indentation in the source.
          pattern = re.compile(r'\s*"ing-cucumber":\s*withDerived\(\{\s*label:\s*"Cucumber juice",\s*g_per_ml:\s*1\.0\s*\}\),')
          replacement = '''
              "ing-cucumber": withDerived({
                label: "Cucumber seed oil",
                g_per_ml: 0.922,
                notes: "Cucumis sativus seed oil. Practical density uses the midpoint of a 0.915–0.930 relative-density specification at 25°C; 240 ml is approximately 221.3 g."
              }),'''
          profiles, count = pattern.subn(replacement, profiles, count=1)
          if count != 1:
              raise SystemExit(f'Expected exactly one incorrect ing-cucumber profile, found {count}')
          profiles_path.write_text(profiles, encoding='utf-8')

          html_path = Path('systems/baseline-natural-skincare/baseline-natural-skincare.html')
          html = html_path.read_text(encoding='utf-8')
          old_src = '/sitewide/js/baseline-ingredient-profiles.js?v=20260527gradienttruth'
          new_src = '/sitewide/js/baseline-ingredient-profiles.js?v=SKINCARE_INGREDIENT_CONVERSIONS_20260828_1'
          if html.count(old_src) != 1:
              raise SystemExit(f'Expected one old ingredient-profile cache key, found {html.count(old_src)}')
          html = html.replace(old_src, new_src, 1)
          html_path.write_text(html, encoding='utf-8')

          # Audit every ingredient ID actually used by skincare recipe markup (main page + standalone recipes).
          sources = [html_path] + sorted(Path('systems/baseline-natural-skincare/recipes').glob('*.html'))
          used = set()
          for path in sources:
              text = path.read_text(encoding='utf-8')
              used.update(re.findall(r'data-ingredient=["\'](ing-[^"\']+)["\']', text))

          profile_text = profiles_path.read_text(encoding='utf-8')
          blocks = {}
          for match in re.finditer(r'"(ing-[^"]+)"\s*:\s*withDerived\(\{([\s\S]*?)\}\)', profile_text):
              blocks[match.group(1)] = match.group(2)

          anchors = ('g_per_ml','g_per_cup','g_per_tbsp','g_per_tsp','g_per_unit','g_per_drop','g_per_pinch','ml_per_unit','ml_per_drop')
          missing_profiles = sorted(i for i in used if i not in blocks)
          missing_conversion = sorted(i for i in used if i in blocks and not any(re.search(rf'\b{re.escape(a)}\s*:', blocks[i]) for a in anchors))

          print(f'Audited {len(used)} unique skincare recipe ingredient IDs.')
          print('Missing profiles:', missing_profiles)
          print('Profiles without conversion anchors:', missing_conversion)
          if missing_profiles or missing_conversion:
              raise SystemExit('Skincare conversion audit failed; do not ship partial conversion coverage.')

          cucumber = blocks.get('ing-cucumber','')
          if not re.search(r'g_per_ml\s*:\s*0\.922\b', cucumber):
              raise SystemExit('Cucumber seed oil conversion is not 0.922 g/ml after patch.')
          PY

      - name: Add permanent conversion coverage regression test
        shell: bash
        run: |
          cat > tests/skincare-ingredient-conversion-coverage.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { fileURLToPath } from 'node:url';

          const here=path.dirname(fileURLToPath(import.meta.url));
          const root=path.resolve(here,'..');
          const profiles=fs.readFileSync(path.join(root,'sitewide/js/baseline-ingredient-profiles.js'),'utf8');
          const main=fs.readFileSync(path.join(root,'systems/baseline-natural-skincare/baseline-natural-skincare.html'),'utf8');
          const recipeDir=path.join(root,'systems/baseline-natural-skincare/recipes');
          const recipeFiles=fs.readdirSync(recipeDir).filter((name)=>name.endsWith('.html'));
          const source=[main,...recipeFiles.map((name)=>fs.readFileSync(path.join(recipeDir,name),'utf8'))].join('\n');
          const used=new Set([...source.matchAll(/data-ingredient=["'](ing-[^"']+)["']/g)].map((match)=>match[1]));
          const blocks=new Map([...profiles.matchAll(/"(ing-[^"]+)"\s*:\s*withDerived\(\{([\s\S]*?)\}\)/g)].map((match)=>[match[1],match[2]]));
          const anchors=['g_per_ml','g_per_cup','g_per_tbsp','g_per_tsp','g_per_unit','g_per_drop','g_per_pinch','ml_per_unit','ml_per_drop'];

          test('every skincare recipe ingredient has explicit conversion data',()=>{
            const missing=[];
            const noAnchor=[];
            for(const id of [...used].sort()){
              if(!blocks.has(id)){missing.push(id);continue;}
              const block=blocks.get(id);
              if(!anchors.some((anchor)=>new RegExp(`\\b${anchor}\\s*:`).test(block))) noAnchor.push(id);
            }
            assert.deepEqual(missing,[],'recipe ingredient IDs missing from ingredient profiles');
            assert.deepEqual(noAnchor,[],'recipe ingredient profiles missing a conversion anchor');
          });

          test('Cucumber Seed Oil is not treated as water',()=>{
            const block=blocks.get('ing-cucumber')||'';
            assert.match(block,/label:\s*"Cucumber seed oil"/);
            assert.match(block,/g_per_ml:\s*0\.922\b/);
            assert.doesNotMatch(block,/g_per_ml:\s*1(?:\.0)?\b/);
            assert.match(main,/Cucumber Seed Oil/);
          });

          test('ingredient profile fix is cache-busted on skincare',()=>{
            assert.match(main,/baseline-ingredient-profiles\.js\?v=SKINCARE_INGREDIENT_CONVERSIONS_20260828_1/);
          });
          EOF

      - name: Run skincare recipe and conversion tests
        shell: bash
        run: |
          node --test tests/skincare-ingredient-conversion-coverage.test.mjs tests/universal-recipe-template.test.mjs tests/skincare-testing-recipes.test.mjs

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-fix-skincare-conversions-20260828.yml
          git add sitewide/js/baseline-ingredient-profiles.js systems/baseline-natural-skincare/baseline-natural-skincare.html tests/skincare-ingredient-conversion-coverage.test.mjs
          git diff --cached --check
          git commit -m "Fix and enforce skincare ingredient conversions"
          git push origin HEAD:main
