name: Apply skincare comprehensive benefits

on:
  push:
    branches:
      - agent/skincare-comprehensive-benefits-20260804
    paths:
      - .github/workflows/apply-skincare-comprehensive-benefits.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/skincare-comprehensive-benefits-20260804
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Apply integration
        run: python3 scripts/apply_skincare_comprehensive_benefits.py

      - name: Install locked dependencies
        run: npm ci

      - name: Verify JavaScript and focused behaviour
        run: |
          node --check systems/baseline-natural-skincare/js/skincare-routine-comprehensive-benefits.js
          node --test tests/skincare-comprehensive-benefits.test.mjs tests/skincare-my-routine.test.mjs tests/skincare-routine-groups-calendar.test.mjs
          npm run test:structure

      - name: Publish clean verified branch
        run: |
          rm scripts/apply_skincare_comprehensive_benefits.py
          rm .github/workflows/apply-skincare-comprehensive-benefits.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace placeholder comprehensive skincare summaries"
          git push origin HEAD:agent/skincare-comprehensive-benefits-20260804
