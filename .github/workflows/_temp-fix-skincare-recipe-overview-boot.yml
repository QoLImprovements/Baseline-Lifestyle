name: Temporary fix Skincare recipe overview boot

on:
  push:
    branches:
      - fix/skincare-testing-embedded-20260823

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: fix/skincare-testing-embedded-20260823
          fetch-depth: 0
      - name: Apply recipe overview boot correction
        run: python tools/_temp_fix_skincare_recipe_overview_boot.py
      - name: Commit correction only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitewide/js/baseline-shared.js
          git diff --cached --quiet && exit 0
          git commit -m "Initialize clean recipe routes before interaction"
          git push origin HEAD:fix/skincare-testing-embedded-20260823
