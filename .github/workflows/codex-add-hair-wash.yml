name: Add Soap-Free Powdered Hair Wash

on:
  push:
    branches:
      - codex/add-soap-free-powdered-hair-wash

permissions:
  contents: write

jobs:
  patch-recipe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/add-soap-free-powdered-hair-wash
          fetch-depth: 0

      - name: Add Testing hair-wash recipe and update coverage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          html_path = Path('systems/baseline-natural-skincare/baseline-natural-skincare.html')
          structural_test_path = Path('tests/skincare-testing-recipes.test.mjs')
          browser_test_path = Path('tests/skincare-testing-recipes-browser.spec.js')

          html = html_path.read_text(encoding='utf-8')
          assert ' id="r11">' not in html, 'r11 already exists'

          side_anchor = '<li><a class="recipe-open" data-recipe-id="r10" href="/baseline-natural-skincare/recipes/testing-microcurrent-conductive-gel">Microcurrent Conductive Gel</a></li>'
          side_add = side_anchor + '\n<li><a class="recipe-open" data-recipe-id="r11" href="/baseline-natural-skincare/recipes/testing-soap-free-powdered-hair-wash">Soap-Free Powdered Hair Wash</a></li>'
          assert html.count(side_anchor) == 1, 'side navigation r10 anchor changed'
          html = html.replace(side_anchor, side_add, 1)

          landing_anchor = '<li><a class="recipe-open" data-recipe-id="r10" href="/baseline-natural-skincare/recipes/testing-microcurrent-conductive-gel">Microcurrent Conductive Gel — glycerin, Dead Sea salt and guar conductive gel.</a></li>'
          landing_add = landing_anchor + '\n<li><a class="recipe-open" data-recipe-id="r11" href="/baseline-natural-skincare/recipes/testing-soap-free-powdered-hair-wash">Soap-Free Powdered Hair Wash — colloidal oatmeal, marshmallow root, chicory-root inulin and sunflower lecithin with a light jojoba/argan conditioning phase.</a></li>'
          assert html.count(landing_anchor) == 1, 'recipe overview r10 anchor changed'
          html = html.replace(landing_anchor, landing_add, 1)

          recipe = '''<!-- Testing Recipe 11 -->
          <div class="recipe card recipe-page" data-category="Testing" data-recipe-slug="testing-soap-free-powdered-hair-wash" id="r11">
          <div class="recipe-actions">
          <button class="back-btn" onclick="BASELINE_showAllRecipes()" type="button">Back To Recipe Overview</button>
          <button class="print-btn" onclick="printCard('r11')" type="button">Print This Recipe</button>
          </div>
          <h3>Soap-Free Powdered Hair Wash</h3>
          <p class="note"><strong>Testing</strong> — formulation currently being tested before promotion into the main recipe collection.</p>
          <a class="info-link" data-scroll-to-ingredients="" href="#ingredients">Recipe Ingredient Information</a>
          <h4>Ingredients</h4>
          <ul>
          <li class="ing-subhead"><strong>Dry Powder Blend — 100 g</strong></li>
          <li data-method-step="1" data-tip="Supports scalp comfort and provides the soft, gentle powder base."><span class="amt" data-base-display="75 g" data-base-max="75" data-base-min="75" data-base-unit="g">75 g</span> <strong>Colloidal Oatmeal</strong></li>
          <li data-method-step="1" data-tip="Provides mucilage, slip and conditioning to reduce friction and tangling."><span class="amt" data-base-display="15 g" data-base-max="15" data-base-min="15" data-base-unit="g">15 g</span> <strong>Marshmallow Root Powder</strong></li>
          <li data-method-step="1" data-tip="Provides lightweight conditioning and moisture-binding support for hair and scalp."><span class="amt" data-base-display="5 g" data-base-max="5" data-base-min="5" data-base-unit="g">5 g</span> <strong>Chicory-Root Inulin</strong></li>
          <li data-method-step="1" data-tip="Helps disperse added oils and natural scalp oils into the rinse water without conventional detergent surfactants."><span class="amt" data-base-display="5 g" data-base-max="5" data-base-min="5" data-base-unit="g">5 g</span> <strong>Sunflower Lecithin Powder</strong></li>
          </ul>
          <p><strong>Total – 100 g dry powder blend</strong></p>
          <h4>For One Wash</h4>
          <ul>
          <li><strong>Powder Blend</strong> – 10 g</li>
          <li><a class="ing-link" data-from-recipe="r11" data-ingredient="ing-water" href="#ing-water">Warm Water</a> – 20–30 g</li>
          <li><strong>Jojoba/Argan Oil Blend</strong> – 0.5–1 g</li>
          </ul>
          <h4>Jojoba/Argan Oil Blend</h4>
          <ul>
          <li><a class="ing-link" data-from-recipe="r11" data-ingredient="ing-jojoba" href="#ing-jojoba">Jojoba Oil</a> – 80%</li>
          <li><a class="ing-link" data-from-recipe="r11" data-ingredient="ing-argan" href="#ing-argan">Argan Oil</a> – 20%</li>
          </ul>
          <h4>Ingredient Roles</h4>
          <ul>
          <li><strong>Colloidal Oatmeal</strong> – supports the scalp barrier, soothes the skin and provides a soft, gentle washing base.</li>
          <li><strong>Marshmallow Root Powder</strong> – provides mucilage, slip, conditioning and helps reduce friction and tangling.</li>
          <li><strong>Chicory-Root Inulin</strong> – provides lightweight conditioning and moisture-binding benefits for the hair and scalp.</li>
          <li><strong>Sunflower Lecithin Powder</strong> – helps disperse the added oils and natural scalp oils into the rinse water without relying on soap or aggressive surfactants.</li>
          <li><strong>Jojoba Oil</strong> – provides lightweight lubrication and a protective lipid layer.</li>
          <li><strong>Argan Oil</strong> – provides emollience, softness and additional conditioning.</li>
          </ul>
          <h4>Method</h4>
          <ol>
          <li><strong>Blend</strong>: Mix the dry powder ingredients thoroughly and store completely dry in an airtight container.</li>
          <li><strong>Measure</strong>: For each wash, place 10 g of the powder blend into a small bowl or container.</li>
          <li><strong>Hydrate</strong>: Add 20–30 g of warm water and mix until a smooth, loose cream forms.</li>
          <li><strong>Add oil</strong>: Add 0.5–1 g of the 80% jojoba / 20% argan oil blend.</li>
          <li><strong>Mix</strong>: Mix thoroughly until evenly combined.</li>
          <li><strong>Apply</strong>: Apply to wet scalp and hair.</li>
          <li><strong>Massage</strong>: Massage gently through the scalp and hair.</li>
          <li><strong>Rinse</strong>: Rinse thoroughly with water.</li>
          </ol>
          <h4>Storage &amp; Use</h4>
          <ul>
          <li>Keep the 100 g powder blend completely dry in an airtight container.</li>
          <li>Use 10 g powder blend with 20–30 g warm water and 0.5–1 g jojoba/argan oil blend per wash.</li>
          <li>Make only enough wet mixture for one use. Once water has been added, use immediately and discard any remainder.</li>
          <li>This is a very gentle, low-detergency wash. Rinsing performance should be assessed during testing, especially on oilier scalps or with heavier product buildup.</li>
          </ul>
          <h4>Comedogenic Considerations</h4>
          <ul>
          <li>This is a rinse-off scalp and hair formula with only a small added oil phase. Jojoba and argan are used for conditioning rather than as the primary washing phase; individual scalp response can still vary.</li>
          </ul>
          <h4>Notes</h4>
          <ul>
          <li><strong>Soap free • Sulfate free • Soapnut free • Shikakai free • Saponin free • No conventional detergent surfactants.</strong></li>
          <li>The 100 g dry blend provides approximately 10 washes when used at 10 g per wash.</li>
          <li>Each 10 g powder dose contains approximately 0.5 g sunflower lecithin. With 0.5–1 g added oil, this gives a lecithin-to-added-oil ratio of roughly 1:1 to 1:2 before accounting for natural scalp oil.</li>
          <li>The small oil dose is deliberate: increasing the added oil too far can reduce rinsability because this formula does not contain a conventional detergent surfactant.</li>
          <li>This recipe is currently grouped under <strong>Testing</strong>.</li>
          </ul>
          </div>
          '''.replace('          ', '')

          recipe_end_marker = '</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</section>\n<!-- INGREDIENT LIBRARY -->'
          assert html.count(recipe_end_marker) == 1, 'recipe section closing marker changed'
          html = html.replace(recipe_end_marker, recipe + recipe_end_marker, 1)

          assert html.count('data-recipe-id="r11"') == 2
          assert html.count(' id="r11">') == 1
          assert 'data-category="Testing" data-recipe-slug="testing-soap-free-powdered-hair-wash" id="r11"' in html
          html_path.write_text(html, encoding='utf-8')

          structural = structural_test_path.read_text(encoding='utf-8')
          structural_anchor = "  ['r10', 'testing-microcurrent-conductive-gel', 'Microcurrent Conductive Gel']\n];"
          structural_replacement = "  ['r10', 'testing-microcurrent-conductive-gel', 'Microcurrent Conductive Gel'],\n  ['r11', 'testing-soap-free-powdered-hair-wash', 'Soap-Free Powdered Hair Wash']\n];"
          assert structural_anchor in structural, 'structural testing recipe array changed'
          structural = structural.replace(structural_anchor, structural_replacement, 1)
          structural_test_path.write_text(structural, encoding='utf-8')

          browser = browser_test_path.read_text(encoding='utf-8')
          browser_anchor = "  { id:'r10', slug:'testing-microcurrent-conductive-gel', title:'Microcurrent Conductive Gel' }\n];"
          browser_replacement = "  { id:'r10', slug:'testing-microcurrent-conductive-gel', title:'Microcurrent Conductive Gel' },\n  { id:'r11', slug:'testing-soap-free-powdered-hair-wash', title:'Soap-Free Powdered Hair Wash' }\n];"
          assert browser_anchor in browser, 'browser testing recipe array changed'
          browser = browser.replace(browser_anchor, browser_replacement, 1)
          browser = browser.replace("await expect(testingLinks).toHaveCount(3);", "await expect(testingLinks).toHaveCount(4);", 1)
          browser = browser.replace("expect(ids).toEqual(['r10','r8','r9']);", "expect(ids).toEqual(['r10','r11','r8','r9']);", 1)
          browser_test_path.write_text(browser, encoding='utf-8')
          PY

          node --test tests/skincare-testing-recipes.test.mjs

          rm -f .github/workflows/codex-add-hair-wash.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add systems/baseline-natural-skincare/baseline-natural-skincare.html tests/skincare-testing-recipes.test.mjs tests/skincare-testing-recipes-browser.spec.js .github/workflows/codex-add-hair-wash.yml
          git commit -m "Add soap-free powdered hair wash to Skincare Testing"
          git push origin HEAD:codex/add-soap-free-powdered-hair-wash
